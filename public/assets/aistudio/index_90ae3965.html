// Hành vi 1 con dơi: tìm quái gần nhất → cắn → bay về Dracula hồi máu/giáp/energy
function updateBat(f,dt){
  const p=player; f.anim+=dt; f.wob+=dt*10;
  if(f.state==='seek'){
    if(!f.target||f.target.hp<=0) f.target=nearest(aliveEnemies(),f.x,f.y,200);
    let tx,ty; if(f.target){ tx=f.target.x; ty=f.target.y-f.target.bo; } else { tx=p.x+Math.cos(gtime*4+f.wob)*28; ty=p.y-10+Math.sin(gtime*4+f.wob)*14; if(f.t<4) f.state='return'; }
    const d=dist(f.x,f.y,tx,ty)||1, sp=215; f.vx+=((tx-f.x)/d*sp-f.vx)*Math.min(1,dt*5); f.vy+=((ty-f.y)/d*sp-f.vy)*Math.min(1,dt*5);
    if(f.target && d<f.target.r+4){ damageEnemy(f.target,3+(f.aw?1:0),false,'#ee4455'); burst(f.x,f.y,5,'#ee4455',50,0.3); f.bit=true; f.state='return';
      if(f.aw){ fx.push({kind:'boomRing',x:f.x,y:f.y,r:14,t:0.2,col:'#a8244f'}); for(const e of aliveEnemies()) if(e!==f.target&&dist(f.x,f.y,e.x,e.y-e.bo)<16) damageEnemy(e,2,false,'#a8244f'); } }
  } else {
    const tx=p.x, ty=p.y-10, d=dist(f.x,f.y,tx,ty)||1; f.vx+=((tx-f.x)/d*260-f.vx)*Math.min(1,dt*7); f.vy+=((ty-f.y)/d*260-f.vy)*Math.min(1,dt*7);
    if(d<8){ f.t=0; if(f.bit){ const c=f.cast;
      if(c.hp>0){ c.hp--; if(p.hp<p.maxHp){ p.hp++; floatText(p.x,p.y-24,'+1 HP','#ee4455'); } else { p.armor=Math.min(p.maxArmor,p.armor+2); floatText(p.x,p.y-24,'+2 ARMOR','#b4bedb'); } }
      if(c.en>0){ c.en--; p.en=Math.min(p.maxEn,p.en+15); }
      part(p.x,p.y-10,0,-20,0.4,'#ee4455',2); } }
  }
  f.x+=(f.vx+Math.cos(f.wob)*20)*dt; f.y+=(f.vy+Math.sin(f.wob*1.3)*20)*dt;
}

// ----- 4. LASER GIỮ CÒ -----
function beamUpdate(w,hold,dt){
  const p=player;
  if(!hold){ p.beamOn=false; p.beamT=0; return; }
  p.beamTick=(p.beamTick||0)-dt;
  if(p.beamTick<=0){
    const cost=w.en*(p.dual>0?2:1);                                  // [AUDIT C3] Song Thủ: 2 tia → tốn ×2 như súng thường
    if(p.en<cost){ p.beamOn=false; p.beamT=0; sfx('click'); p.enFlash=0.3; p.beamTick=0.3; return; }
    p.en-=cost; p.beamTick=0.15; p.beamOn=true; beamDamage(w); sfx('zap');
  }
  if(p.beamOn) p.beamT+=dt;
}
function beamGeom(){
  const p=player, w=curW().def, spr=heldSpr(w), m=feetScale(muzzlePos(handPos(1),p.aim,spr,0));   // [PLAN HD-05]
  const wall=beamLength(m.x,m.y,p.aim,240,R.map,R.W,R.H);
  return {x:m.x,y:m.y,a:p.aim,L:Math.min(wall,p.beamStop||1e9),wide:p.beamT>1.2};
}
// Mỗi nhịp 0.15s: gây sát thương dọc tia (tia ion dừng ở quái đầu tiên, lăng kính xuyên qua tất cả)
function beamDamage(w){
  const p=player; p.beamStop=0; const G=beamGeom(), c=Math.cos(G.a), s=Math.sin(G.a), width=(G.wide?5:3)*(run.cards.laser?1.3:1);
  const hits=[];
  for(const e of aliveEnemies()){ const dx=e.x-G.x, dy=e.y-e.bo-G.y, t=dx*c+dy*s; if(t<0||t>G.L) continue; if(Math.abs(-dx*s+dy*c)<e.r+width) hits.push([t,e]); }
  hits.sort((a,b)=>a[0]-b[0]);
  const list=w.pierceBeam?hits:hits.slice(0,1);
  if(!w.pierceBeam && list.length) p.beamStop=list[0][0]+4;
  for(const [,e] of list){ const crit=Math.random()*100<p.crit+(w.crit||0)+run.critAdd; const dmg=Math.round(w.dmg*(G.wide?1.6:1)*(run.cards.laser||1))*(crit?2:1);
    damageEnemy(e,dmg,crit); if(crit&&run.cards.elemental) elementalBurst(e.x,e.y-e.bo,null); }
  // laser cũng phá thùng ở cuối tia
  const ex=G.x+c*(G.L+2), ey=G.y+s*(G.L+2), ti=Math.floor(ey/TS)*R.W+Math.floor(ex/TS); if(R.map[ti]===4) damageProp(ti,1);
}
function drawBeam(){
  const p=player; if(!p.beamOn) return; const w=curW().def, G=beamGeom(), wid=(G.wide?2.4:1.6)*(run.cards.laser?1.3:1), pulse=0.5+0.5*Math.sin(gtime*30);
  g.save(); g.translate(G.x-CX,G.y-CY); g.rotate(G.a);
  g.globalAlpha=0.35+0.25*pulse; g.fillStyle=w.beamCol; g.fillRect(0,-wid-pulse*0.6,G.L,(wid+pulse*0.6)*2);
  g.globalAlpha=1; g.fillStyle=w.beamCol; g.fillRect(0,-wid*0.6,G.L,wid*1.2);
  g.fillStyle='#ffffff'; g.fillRect(0,-wid*0.25,G.L,Math.max(PX,wid*0.5));
  g.restore();
  if(Math.random()<0.6) part(G.x+Math.cos(G.a)*G.L,G.y+Math.sin(G.a)*G.L,rr(-40,40),rr(-40,40),0.25,pick([w.beamCol,'#ffffff']),1);
}

// ----- 5. HIỆU ỨNG CHÍ MẠNG NGUYÊN TỐ (lá Elemental Mastery) -----
function elementalBurst(x,y,b){
  const kind=b&&b.fire?'fire':b&&(b.chill||b.freeze)?'ice':b&&b.poison?'poison':pick(['fire','ice','poison']);
  const col={fire:'#ff9b30',ice:'#bfeaf5',poison:'#92ea5e'}[kind];
  fx.push({kind:'boomRing',x,y,r:18,t:0.25,col}); burst(x,y,10,col,60,0.35,2);
  for(const e of aliveEnemies()) if(dist(x,y,e.x,e.y-e.bo)<20+e.r){ if(kind==='fire') e.burn=Math.max(e.burn||0,2); else if(kind==='ice') e.chill=Math.max(e.chill||0,2); else e.poison=Math.max(e.poison||0,3); }
}

// ----- 6. VẬT THỂ MỚI: máy bán hàng, quầy kỹ năng, lò rèn, lá bài, thùng nguyên tố -----
function populateExtras(){
  const cx=R.cx*TS, cy=R.cy*TS+8;
  if(room.type==='start') room.items.push({kind:'vending',x:cx-44,y:3*TS+14,uses:0,shake:0,price:10+Math.min(15,run.floor*2+run.level)});
  if(room.type==='shop'){
    room.items.push({kind:'skillshop',x:cx-28,y:cy-18,sell:'tome',price:45+run.floor*5,shake:0});
    room.items.push({kind:'skillshop',x:cx+28,y:cy-18,sell:'alt',price:30+run.floor*3,shake:0});
  }
  if(room.type==='treasure' && Math.random()<0.6) room.items.push({kind:'forge',x:R.cx*TS+40,y:R.cy*TS+8,shake:0});
  // Bệ Thờ Kỹ Năng: ngẫu nhiên ở phòng đầu (từ tầng 1-2) và phòng kho báu – chọn miễn phí 1 lá kỹ năng
  if((room.type==='start'&&(run.floor+run.level)>0&&Math.random()<0.3)||(room.type==='treasure'&&Math.random()<0.35))
    room.items.push({kind:'shrine',x:room.type==='start'?cx+44:R.cx*TS-40,y:room.type==='start'?3*TS+14:R.cy*TS+8,used:false});
  // thùng nguyên tố trong phòng đấu
  R.propKind=R.propKind||{};
  if(room.type==='combat'||room.type==='exit'||room.type==='boss') for(let i=0;i<R.map.length;i++) if(R.map[i]===4){ const r=Math.random();
    R.propKind[i]= r<0.22?'explosive':r<0.34?'cryo':r<0.46?'toxic':''; }
  R.dirty=true;
}
// [PLAN FX-31] xoá khai báo forgePrice thứ nhất (trùng thân với bản khai báo sau – bản sau thắng khi hoisting)
function interactExtra(it){
  const p=player;
  if(it.kind==='vending'){
    if(it.uses>=2){ floatText(it.x,it.y-26,'EMPTY','#8290b5'); sfx('error'); return true; }
    if(run.gold<it.price){ it.shake=0.3; sfx('error'); floatText(it.x,it.y-26,it.price+'G','#ee4455'); return true; }
    run.gold-=it.price; it.uses++; it.shake=0.5; sfx('coin');
    setTimeout0(0.5,at=>{ const r=Math.random(), x=at?at.x:it.x, y=(at?at.y:it.y)+6; sfx('chestOpen');   // [PLAN FX-26] đã sang phòng khác: rơi cạnh người chơi
      if(r<0.4) dropItem('weapon',x,y,{wid:rollWeapon(2),bob:0}); else if(r<0.75) dropItem(Math.random()<0.5?'hp':'en',x,y); else dropItem('card',x,y); },{carry:true});
    return true; }
  if(it.kind==='skillshop'){
    if(it.sold) return true;
    if(it.sell==='tome'&&run.awaken){ floatText(it.x,it.y-26,'MAX','#ffd93d'); return true; }
    if(run.gold<it.price){ it.shake=0.3; sfx('error'); return true; }
    run.gold-=it.price; it.sold=true; sfx('chestOpen'); burst(it.x,it.y-10,14,'#ffd93d',60,0.5);
    if(it.sell==='tome'){ run.awaken=1; floatText(p.x,p.y-26,'SKILL AWAKENED!','#ffd93d'); }
    else { p.alt=!p.alt; floatText(p.x,p.y-26,'SKILL: '+skillName(),'#ffd93d'); }
    return true; }
  if(it.kind==='forge'){
    const d=curW().def, price=forgePrice();
    if((d.lvl||0)>=3){ floatText(it.x,it.y-20,'MAX +3','#ffd93d'); return true; }
    if(run.gold<price){ it.shake=0.3; sfx('error'); floatText(it.x,it.y-20,price+'G','#ee4455'); return true; }
    run.gold-=price; d.lvl=(d.lvl||0)+1; d.dmg+=2; d.crit=(d.crit||0)+10; it.shake=0.3; sfx('boom'); burst(it.x,it.y-8,16,'#ff9b30',70,0.5,2);
    floatText(p.x,p.y-26,d.name+' +'+d.lvl,'#ffd93d'); return true; }
  if(it.kind==='card'){ items.splice(items.indexOf(it),1); openCards('buff'); return true; }
  if(it.kind==='shrine'){ if(it.used) return true; it.used=true; sfx('portal'); burst(it.x,it.y-12,18,'#ffd93d',60,0.6,2); openCards('shrine'); return true; }
  return false;
}

// Trên đầu: lóe sáng vòng năng lượng + tia chớp khi kỹ năng vừa sẵn sàng

function handAt(p,a,w){
  const C=CLASSES[p.cls], H=(HERO[p.cls]&&HERO[p.cls].hand)||{x:C.handX||5,y:C.handY||4}, by=bobOf(p)+Math.round(p.spawnDrop||0);
  if(w&&w.upright) return {x:Q(p.x+p.facing*H.x), y:Q(p.y-H.y)-by};
  return {x:Q(p.x+Math.cos(a)*H.x), y:Q(p.y-H.y+Math.sin(a)*H.x*0.5)-by};
}
handPos=function(sign){
  const p=player, s=sign||1, C=CLASSES[p.cls], H=(HERO[p.cls]&&HERO[p.cls].hand)||{x:C.handX||5,y:C.handY||4};
  if(s<0) return {x:Q(p.x-p.facing*H.x), y:Q(p.y-H.y)-bobOf(p)-Math.round(p.spawnDrop||0)};
  const w=p.weapons&&p.weapons[p.wi]?p.weapons[p.wi].def:null;
  return handAt(p,p.aim,w);
};
const ease3=t=>1-Math.pow(1-t,3), easeIO=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function swingK(p){ return p.swing>0?1-p.swing/0.25:-1; }
function weaponAngle(p,w){
  if(p.spinT>0) return p.aim+(1-p.spinT/0.45)*TAU*p.facing;
  if(p.raiseT>0) return -Math.PI/2+0.3*p.facing;
  if(w.type!=='melee') return p.aim;
  const f=p.facing, k=swingK(p);
  if(p.meleeHeld&&p.chargeT>0.15) return p.aim+f*(-1.9+Math.sin(gtime*40)*0.05);       // tụ lực: giơ cao ra sau, run run
  if(k<0) return p.aim-f*0.45;                                                             // nghỉ: mũi hơi chếch lên
  const base=p.swingA!==undefined?p.swingA:p.aim;
  const off=k<0.4? -2.0+3.4*ease3(k/0.4) : 1.4-1.85*easeIO((k-0.4)/0.6);
  return base+f*off;
}
function drawMuzzleFlash(m,col,big){

  g.fillStyle=col; g.fillRect(x-3*s,y-PX,6*s,PX*2); g.fillRect(x-PX,y-3*s,PX*2,6*s);
  g.fillRect(x-1.6*s,y-1.6*s,3.2*s,3.2*s); g.fillStyle='#ffffff'; g.fillRect(x-0.9*s,y-0.9*s,1.8*s,1.8*s);
}

    g.fillStyle='#1a1425'; g.fillRect(X-1,Y-1,16,3); g.fillStyle=f>=1?(Math.floor(gtime*12)%2?'#ffffff':'#ffd93d'):'#ff9b30'; g.fillRect(X,Y,Math.round(14*f),1);

// Vệt chém lưỡi liềm: quét theo hướng vung, đầu dày đuôi mảnh, lõi trắng, mờ dần
function drawSlash(f){
  const k=1-f.t/0.25, reveal=Math.min(1,k/0.32), fade=k<0.32?1:Math.max(0,1-(k-0.32)/0.68), dir=(Math.cos(f.a)<0?-1:1)*(f.rev?-1:1);
  const a0=f.a-dir*f.arc, span=2*f.arc*dir, TH=(f.big?7:5)*(0.75+0.25*fade), r=f.r+1, n=20, x=f.x-CX, y=f.y-CY;
  const poly=(rad,th,col,al)=>{ g.globalAlpha=al; g.fillStyle=col; g.beginPath();
    for(let i=0;i<=n;i++){ const u=i/n, ang=a0+span*reveal*u; g.lineTo(x+Math.cos(ang)*rad,y+Math.sin(ang)*rad); }

function runtimeTests(){
  const log=[], realStep=step; let ok=0;
  const save0=JSON.stringify(SAVE), realWrite=writeSave, touch0=isTouch; rtRealStep=realStep;
  step=function(){};                              // đóng băng vòng lặp thật, tự bước bằng realStep
  writeSave=function(){};                         // không ghi đè save thật của người chơi trong lúc test
  // sim() mô phỏng đúng frame(): khung hit-stop chỉ giảm hitStop và KHÔNG xoá pressed
  const sim=(n,each)=>{ for(let i=0;i<n;i++){ each&&each(i); if(hitStop>0) hitStop--; else { realStep(1/60); for(const k in pressed) delete pressed[k]; } } };
  try{
    for(const t of RT){
      try{ const r=t.fn(sim); log.push((r!==false?'OK   ':'FAIL ')+t.name+(typeof r==='string'?' - '+r:'')); if(r!==false) ok++; }
      catch(e){ log.push('FAIL '+t.name+': '+(e&&e.message||e)); }
      finally{ try{ rtReset(); }catch(_){} }       // một test lỗi không làm bẩn test sau
    }
  } finally {
    step=realStep; writeSave=realWrite; SAVE=JSON.parse(save0); isTouch=touch0;
    try{ rtReset(); }catch(_){}
    ARMORY_PICK=null; godMode=false; toastT=0; banner=0; run=null; player=null;
  }
  return log;
}

  g.setTransform(SCALE_UNIT,0,0,SCALE_UNIT,0,0); g.globalAlpha=1; g.globalCompositeOperation='source-over'; g.imageSmoothingEnabled=false;
  if(['play','pause','cards','over','victory'].includes(state) && R && player){ renderWorld();
    if(skillFlashT>0){ g.globalAlpha=skillFlashT/0.25*0.28; g.fillStyle=skillFlashCol; g.fillRect(0,0,VW,VH); g.globalAlpha=1; }
    drawHUD(); }
  if(state!=='play') renderScreens();
  if(fade>0){ g.fillStyle=`rgba(12,9,22,${(1-Math.abs(fade-0.1)/0.1).toFixed(2)})`; g.fillRect(0,0,VW,VH); }
  if(whiteFlash>0){ g.fillStyle=`rgba(255,255,255,${(whiteFlash*0.6).toFixed(2)})`; g.fillRect(0,0,VW,VH); }
  present();
}

// =====================================================================
// PHẦN 9 – VÒNG LẶP CHÍNH (timestep cố định 60Hz)
// =====================================================================
let lastT=performance.now(), acc=0, fps=60, fpsN=0, fpsT=0;
const STEP=1/60;
// Phím toàn cục: pause, mute, debug F2–F5
function globalKeys(){
  if(pressed.KeyM){ toggleMute(); }
  if(CONFIG.DEBUG && pressed.F6 && (state==='title'||state==='select'||state==='shop')){ for(const k of CLASS_ORDER) if(!SAVE.unlocked.includes(k)) SAVE.unlocked.push(k); writeSave(); toast='DEBUG: ALL HEROES UNLOCKED'; toastT=1.5; }   // [PLAN BL-02] F6 chỉ khi ?debug
  if(state==='play'){
    if(pressed.Escape||pressed.KeyP){ state='pause'; menuSel=0; return; }
    if(CONFIG.DEBUG){   // [PLAN BL-02] phím debug F2–F5 chỉ hoạt động khi mở với ?debug
    if(pressed.F2) CONFIG.SHOW_DEBUG=!CONFIG.SHOW_DEBUG;
    if(pressed.F3) items.push({kind:'weapon',x:player.x,y:player.y+4,wid:pick(LOOT_TABLE),bob:0});
    if(pressed.F4){ const b=floorData.rooms.find(r=>r.type==='boss'||r.type==='exit'); if(b&&b!==room){ fade=0.2; fadeAct=()=>enterRoom(b.id,null); } }
    if(pressed.F5){ godMode=!godMode; toast=godMode?'GOD MODE ON':'GOD MODE OFF'; toastT=1; }
    }
  } else if(state==='pause' && (pressed.Escape||pressed.KeyP)){ state='play'; }
}
function clearPressed(){ for(const k in pressed) delete pressed[k]; }
// Phím toàn cục đã xử lý xong thì xóa ngay để không lặp lại ở khung sau
const GLOBAL_EDGE=['KeyM','F2','F3','F4','F5','F6','F7','Escape','KeyP'];   // [AUDIT C2] F7 cũng là phím toàn cục (debug bệ dung hợp)
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(0.25,(now-lastT)/1000); lastT=now;
  fpsN++; fpsT+=dt; if(fpsT>=1){ fps=fpsN; fpsN=0; fpsT=0; }
  let ran=true;
  try{
    const wasPlay=state==='play';
    globalKeys();
    if(wasPlay) for(const k of GLOBAL_EDGE) delete pressed[k];
    if(state==='play'){
      acc+=dt*(slowmo>0?0.3:1); if(slowmo>0) slowmo-=dt;
      let n=0, stepped=false;
      // [AUDIT C2] khung hit-stop KHÔNG chạy step → không được xoá phím vừa bấm (trước đây K/Q/E bấm đúng lúc đánh trúng bị nuốt)
      while(acc>=STEP && n<5){ if(hitStop>0) hitStop--; else { step(STEP); clearPressed(); stepped=true; } acc-=STEP; n++; if(state!=='play') break; }
      if(n>=5) acc=0;
      ran=stepped;
    } else { acc=0; uiUpdate(dt); }
    syncCursor();
    render();
  }catch(err){ console.error(err); BOOT_ERROR=(err&&err.stack||err)+''; state='error'; }
  // Khung không chạy bước logic nào (màn 120/144Hz) → GIỮ phím vừa bấm cho bước sau, tránh mất lần bấm E/K/Q
  if(ran) clearPressed(); ptr.click=false;
}
// Khởi động: bake sprite, chạy selfTest nếu có #test
function boot(){
  try{ bootAssets(); }catch(err){ BOOT_ERROR=err.message; state='error'; requestAnimationFrame(frame); return; }
  if(location.hash==='#test'){ try{ testLog=selfTest(); }catch(err){ testLog=(testLog||[]).concat(['FAIL '+err.message]); } state='test'; }
  else if(location.hash==='#rtest'){ try{ testLog=runtimeTests(); }catch(err){ testLog=(testLog||[]).concat(['FAIL runtimeTests: '+err.message]); } state='test'; }   // [PLAN BL-03] runtime test
  else state='title';
  setMusic(null);
  requestAnimationFrame(frame);
}
// TODO (mở rộng sau): co-op, boss rush, chế độ thử thách.
if(CONFIG.DEBUG) window.__game={get state(){return state;}, get player(){return player;}, get room(){return room;}, get enemies(){return enemies;}, get run(){return run;}, startRun, enterRoom, newLevel, get selHero(){return selHero;}, damageEnemy, useSkill, get floorData(){return floorData;}, selfTest, setGod(v){godMode=v;}};   // [PLAN BL-02] chỉ khi ?debug
boot();
</script>
