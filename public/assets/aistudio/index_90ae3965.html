// Ghép nửa trái + nửa phải lật gương nếu sym
function expandRows(rows, sym){ return sym ? rows.map(r=>r+[...r].reverse().join('')) : rows.slice(); }
// Đổi màu theo bảng remap (áp cho thân/chân)
function remapRows(rows, map){ return rows.map(r=>[...r].map(c=>map[c]||c).join('')); }
// Lật ngang dữ liệu ký tự (bake sẵn hướng trái)
function flipRows(rows){ return rows.map(r=>[...r].reverse().join('')); }
// Kiểm tra mọi hàng cùng độ dài
function validate(name, rows){
  if(!rows.length) throw new Error(`${name}: empty sprite`);
  const w = rows[0].length;
  rows.forEach((r,i)=>{ if(r.length!==w) throw new Error(`${name}: row ${i} len ${r.length} != ${w}`); });
}
// Đổi dữ liệu ký tự thành mảng màu (trình duyệt sẽ đổi tiếp thành canvas)
function bake(name, rows, palette){
  validate(name, rows);
  const h=rows.length, w=rows[0].length, px=new Array(w*h).fill(null);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const k=rows[y][x]; if(k==='.') continue;
    const col=palette[k]; if(!col) throw new Error(`${name}: unknown key '${k}' at ${x},${y}`);
    px[y*w+x]=col;
  }
  return {w,h,px};
}


// ===== 1b. BỘ DỰNG SPRITE PIXEL 64×64 =====
// Mỗi ô ký tự gốc → khối SCALE_UNIT×SCALE_UNIT pixel trên lưới game. 1 ô = 16 đơn vị = 48 pixel;
// pixel art nhân vật (≈42–59 px) cao xấp xỉ 1 ô. Màn 1080p/4K phóng đúng ×2/×4 → pixel nét tuyệt đối.
// Game vẽ vào bộ đệm đúng lưới này (tắt làm mịn) rồi mới phóng lên màn hình → pixel vuông, sắc, không "nhựa".
const SCALE_UNIT = 3;
const PX = 1/SCALE_UNIT;                 // 1 pixel lưới tính theo đơn vị thế giới
const GLOW_KEYS = 'CLYMO';                       // lõi phát sáng (lửa, băng, điện, axit, plasma)
function hexRGB(h){ const v=parseInt(h.slice(1),16); return [v>>16&255,v>>8&255,v&255]; }
// Dựng ảnh HD dạng RGBA thuần (chạy được trong Node). opts.tile: biên quấn vòng (tile lát liền mạch)
function synthHD(name, rows, palette, opts){
  opts=opts||{}; validate(name, rows);
  const S=SCALE_UNIT, h=rows.length, w=rows[0].length, W=w*S, H=h*S, data=new Uint8ClampedArray(W*H*4);
  const tile=!!opts.tile, hiF=tile?0.08:0.14, shF=tile?0.12:0.2;
  const at=(x,y)=>{ if(tile){ x=(x%w+w)%w; y=(y%h+h)%h; } else if(x<0||y<0||x>=w||y>=h) return '.'; return rows[y][x]; };
  const RGB={}; for(const r of rows) for(const k of r){ if(k==='.'||RGB[k]) continue; const col=palette[k]; if(!col) throw new Error(`${name}: unknown key '${k}'`); RGB[k]=hexRGB(col); }
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const c=rows[y][x], N=at(x,y-1), Sd=at(x,y+1), Wd=at(x-1,y), E=at(x+1,y);
    const outN=N==='.', outS=Sd==='.', outW=Wd==='.', outE=E==='.', hasOut=outN||outS||outW||outE;
    for(let v=0;v<S;v++) for(let u=0;u<S;u++){
      let ch=c;
      // (1) Bo góc kiểu EPX: vát bậc 1–3px ở góc có 2 cạnh kề cùng màu khác ô
      if(u+v<=1 && Wd===N && Wd!==c && Wd!==Sd && N!==E) ch=N;
      else if((S-1-u)+v<=1 && N===E && N!==c && N!==Wd && E!==Sd) ch=N;
      else if(u+(S-1-v)<=1 && Wd===Sd && Wd!==c && Wd!==N && Sd!==E) ch=Sd;
      else if((S-1-u)+(S-1-v)<=1 && E===Sd && E!==c && E!==N && Sd!==Wd) ch=Sd;
      // (2) Viền đen mảnh 3px: phần K nằm sâu trong lòng nhường cho màu bên trong
      else if(c==='K' && hasOut){
        const dOut=Math.min(outN?v:99, outS?S-1-v:99, outW?u:99, outE?S-1-u:99);
        if(dOut>=2){ let best=99, pick=null;
          for(const [nb,d] of [[N,v],[Sd,S-1-v],[Wd,u],[E,S-1-u]]) if(nb!=='.'&&nb!=='K'&&d<best){ best=d; pick=nb; }

      }
      const X=x*S+u, Y=y*S+v, o=(Y*W+X)*4;
      if(ch==='.') continue;
      let [r,g,b]=RGB[ch]||hexRGB(palette[ch]);

function synthNative(name, rows, palette, k){

// Khung đi cho pixel art gốc: 'a' nhấc bàn chân trái 1 hàng, 'b' nhấc bàn chân phải
function artWalk(rows, frame){
  if(frame!=='a'&&frame!=='b') return rows.slice();
  const r=rows.map(x=>[...x]), h=r.length, w=r[0].length, last=h-1;
  const cols=[]; for(let x=0;x<w;x++) if(r[last][x]!=='.') cols.push(x);
  if(!cols.length) return rows.slice();
  const mid=(cols[0]+cols[cols.length-1])/2;
  for(const x of cols) if(frame==='a' ? x<mid : x>mid){ r[last][x]='.'; }
  return r.map(x=>x.join(''));
}

// Giá trị ô: 0 sàn, 1 tường, 2 cửa mở, 3 cổng đóng, 4 thùng/phuy
const TS=16;
// Ô có chặn đường không
function solidV(v){ return v===1||v===3||v===4; }
function solidAt(map,W,H,tx,ty){ if(tx<0||ty<0||tx>=W||ty>=H) return true; return solidV(map[ty*W+tx]); }
// Di chuyển tách trục + trượt tường
function moveEntity(e, dx, dy, map, W, H){
  if(dx){ e.x += dx; if(hit(e)) { e.x -= dx;
    const s=Math.sign(dx); let g=0; while(!hit(e) && g++<200) e.x += s*0.25; e.x -= s*0.25; } }
  if(dy){ e.y += dy; if(hit(e)) { e.y -= dy;
    const s=Math.sign(dy); let g=0; while(!hit(e) && g++<200) e.y += s*0.25; e.y -= s*0.25; } }
  function hit(e){
    const x0=Math.floor((e.x-e.hw)/TS), x1=Math.floor((e.x+e.hw-0.001)/TS);
    const y0=Math.floor((e.y-e.hh)/TS), y1=Math.floor((e.y+e.hh-0.001)/TS);
    for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++) if(solidAt(map,W,H,tx,ty)) return true;
    return false;
  }
}
// Thực thể có đang chồng lên ô đặc không
function overlapsSolid(e,map,W,H){
  const x0=Math.floor((e.x-e.hw)/TS), x1=Math.floor((e.x+e.hw-0.001)/TS);
  const y0=Math.floor((e.y-e.hh)/TS), y1=Math.floor((e.y+e.hh-0.001)/TS);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++) if(solidAt(map,W,H,tx,ty)) return true;
  return false;
}
// Đẩy thực thể bị kẹt ra ô trống gần nhất
function unstick(e,map,W,H){
  if(!overlapsSolid(e,map,W,H)) return false;
  const ox=e.x, oy=e.y;
  for(let r=1;r<12;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue;
    const tx=Math.floor(ox/TS)+dx, ty=Math.floor(oy/TS)+dy;
    if(solidAt(map,W,H,tx,ty)) continue;
    e.x=tx*TS+8; e.y=ty*TS+8;
    if(!overlapsSolid(e,map,W,H)) return true;
  }
  e.x=ox; e.y=oy; return false;
}
// ===== 4. SEEDED RNG + DUNGEON GRAPH =====
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// Sinh đồ thị phòng dạng cây trên lưới
function genFloor(seed, nRooms){
  const rnd=mulberry32(seed), key=(x,y)=>x+','+y, at=new Map();
  const rooms=[{id:0,gx:0,gy:0,type:'start',doors:{}}]; at.set('0,0',rooms[0]);
  const DIRS=[[0,-1,'N','S'],[1,0,'E','W'],[0,1,'S','N'],[-1,0,'W','E']];
  let guard=0;
  while(rooms.length<nRooms && guard++<5000){
    const base=rooms[Math.floor(rnd()*rooms.length)];
    const d=DIRS[Math.floor(rnd()*4)];
    const nx=base.gx+d[0], ny=base.gy+d[1];
    if(at.has(key(nx,ny))) continue;
    let nb=0; for(const e of DIRS) if(at.has(key(nx+e[0],ny+e[1]))) nb++;
    if(nb>1) continue;
    const r={id:rooms.length,gx:nx,gy:ny,type:'combat',doors:{}};
    rooms.push(r); at.set(key(nx,ny),r);
    base.doors[d[2]]=r.id; r.doors[d[3]]=base.id;
  }
  const depth=new Array(rooms.length).fill(-1); depth[0]=0; const q=[0];
  while(q.length){const c=q.shift(); for(const k in rooms[c].doors){const n=rooms[c].doors[k]; if(depth[n]<0){depth[n]=depth[c]+1;q.push(n);}}}
  let boss=0; rooms.forEach(r=>{ if(depth[r.id]>depth[boss]) boss=r.id; });
  rooms[boss].type='boss';
  const dead=rooms.filter(r=>r.id!==0&&r.id!==boss&&Object.keys(r.doors).length===1);
  if(dead[0]) dead[0].type='treasure'; if(dead[1]) dead[1].type='shop';
  // Tầng nào cũng có shop (quầy kỹ năng): thiếu ngõ cụt thì mọc thêm 1 phòng lá cạnh 1 phòng không phải boss
  if(!dead[1]){
    const cands=rooms.filter(r=>r.id!==boss);
    for(let tries=0;tries<400;tries++){
      const base=cands[Math.floor(rnd()*cands.length)], d=DIRS[Math.floor(rnd()*4)];
      const nx=base.gx+d[0], ny=base.gy+d[1]; if(at.has(key(nx,ny))) continue;
      let nb=0; for(const e of DIRS) if(at.has(key(nx+e[0],ny+e[1]))) nb++; if(nb>1) continue;
      const r={id:rooms.length,gx:nx,gy:ny,type:'shop',doors:{}}; rooms.push(r); at.set(key(nx,ny),r);
      base.doors[d[2]]=r.id; r.doors[d[3]]=base.id; depth.push(depth[base.id]+1); break;
    }
  }
  return {rooms,depth,boss};
}
// ===== 5. HELPERS =====
// Xoay ma trận ký tự 90° theo chiều kim đồng hồ (giữ nguyên pixel)
function rotate90(rows){
  const h=rows.length,w=rows[0].length,out=[];
  for(let x=0;x<w;x++){ let s=''; for(let y=h-1;y>=0;y--) s+=rows[y][x]; out.push(s); }
  return out;
}
// Bóng trắng cho hit-flash
function silhouette(rows){ return rows.map(r=>[...r].map(c=>c==='.'?'.':'W').join('')); }
// Làm tối bảng màu (khung chết)
function darkenPalette(pal,f){ const o={}; for(const k in pal){ const v=parseInt(pal[k].slice(1),16);
  const r=Math.min(255,(v>>16&255)*f|0),g=Math.min(255,(v>>8&255)*f|0),b=Math.min(255,(v&255)*f|0); o[k]='#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);} return o; }
// Khung DEAD: xoay 90°, nhắm mắt, dán sát đáy
function deadRows(idleRows){
  const r=rotate90(idleRows).map(s=>s.replace(/W/g,'K'));
  const h=r.length, w=r[0].length;
  let top=0; while(top<h && /^\.*$/.test(r[top])) top++;
  const body=r.slice(top);
  const out=Array.from({length:h},()=>'.'.repeat(w));
  for(let i=0;i<body.length;i++) out[h-body.length+i]=body[i];
  return out;
}
// Thu nhỏ ma trận ký tự kiểu láng giềng gần nhất (slime con)
function shrinkRows(rows,f){
  const h=rows.length,w=rows[0].length,nh=Math.max(1,Math.round(h*f)),nw=Math.max(1,Math.round(w*f)),out=[];
  for(let y=0;y<nh;y++){ let s=''; for(let x=0;x<nw;x++) s+=rows[Math.min(h-1,Math.floor(y/f))][Math.min(w-1,Math.floor(x/f))]; out.push(s); }
  return out;
}
// [PLAN HD-06] MỘT phép biến đổi dùng chung cho vẽ (drawGun), đầu nòng, tay phụ, mũi lưỡi.
// Đúng thứ tự drawGun: translate(tay) → rotate(ang) → (lật Y) → translate(-giật,0) → rotate(-rot0) → ảnh tại (-gx,-gy).
// Trả hàm (ux,uy) toạ độ ĐƠN VỊ trong sprite → toạ độ thế giới.
function heldXform(spr, hand, ang, flipY, recoil){
  const fl=flipY===undefined?(Math.cos(ang)<0):!!flipY, r0=spr.rot0||0, c=Math.cos(ang), s=Math.sin(ang), c0=Math.cos(-r0), s0=Math.sin(-r0), rc=recoil||0;
  return (ux,uy)=>{ const qx=ux-spr.gx, qy=uy-spr.gy, rx=qx*c0-qy*s0-rc, ry=(qx*s0+qy*c0)*(fl?-1:1);
    return {x:hand.x+rx*c-ry*s, y:hand.y+rx*s+ry*c}; };
}
// Vị trí đầu nòng (world px) – [PLAN HD-06] dùng chung heldXform
function muzzlePos(hand, aim, wpn, recoil){
  return heldXform(wpn,hand,aim,undefined,recoil)(wpn.mx,wpn.my);
}
// Phép biến đổi y hệt renderer (chỉ để test muzzlePos)
function drawnPixelPos(hand, aim, wpn, recoil, px, py){
  const flip = Math.cos(aim) < 0 ? -1 : 1, r0=wpn.rot0||0;
  // giống renderer: translate(tay) → rotate(aim) → scale(1,flip) → translate(-giật,0) → rotate(-rot0) → vẽ tại (-gx,-gy)
  const qx=px-wpn.gx, qy=py-wpn.gy, rx=qx*Math.cos(-r0)-qy*Math.sin(-r0)-recoil, ry=(qx*Math.sin(-r0)+qy*Math.cos(-r0));
  const lx = rx, ly = ry*flip;
  return { x: hand.x + lx*Math.cos(aim) - ly*Math.sin(aim), y: hand.y + lx*Math.sin(aim) + ly*Math.cos(aim) };
}
// Tầm nhìn: lấy mẫu mỗi 12px
function hasLOS(x1,y1,x2,y2,map,W,H){
  const d=Math.hypot(x2-x1,y2-y1), n=Math.max(1,Math.ceil(d/12));
  for(let i=1;i<n;i++){ const t=i/n, tx=Math.floor((x1+(x2-x1)*t)/16), ty=Math.floor((y1+(y2-y1)*t)/16);
    if(solidAt(map,W,H,tx,ty)) return false; }
  return true;
}
// Luật khóa cửa: chân người chơi vào sâu >= margin
function insideEnough(px,py,room){ const m=CONFIG.DOOR_LOCK_MARGIN; return px>=room.x0+m && px<=room.x1-m && py>=room.y0+m && py<=room.y1-m; }

// ===== 6. ROOM BUILDER (tile map + vật cản + flood-fill) =====
// Kiểm tra mọi ô đi được đều liên thông với tâm phòng
function floodOK(map,W,H,sx,sy){
  if(solidAt(map,W,H,sx,sy)) return false;
  const seen=new Uint8Array(W*H), st=[sy*W+sx]; seen[sy*W+sx]=1; let cnt=1, total=0;
  for(let i=0;i<W*H;i++) if(!solidV(map[i])) total++;
  while(st.length){ const c=st.pop(), x=c%W, y=(c/W)|0;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=W||ny>=H) continue; const ni=ny*W+nx;
      if(seen[ni]||solidV(map[ni])) continue; seen[ni]=1; cnt++; st.push(ni); } }
  return cnt===total;
}
// Các ô cửa của một phòng theo hướng
function doorTiles(W,H,dir){
  const cx=W/2, cy=Math.floor((2+H-1)/2);
  if(dir==='N') return [[cx-1,0],[cx,0],[cx-1,1],[cx,1]];
  if(dir==='S') return [[cx-1,H-1],[cx,H-1]];
  if(dir==='W') return [[0,cy-1],[0,cy]];
  return [[W-1,cy-1],[W-1,cy]];
}
// Sinh bản đồ ô của một phòng, đảm bảo liên thông (tối đa 20 lần thử)
function buildRoom(seed, type, doors){
  const big = type==='boss'; const W=big?24:20, H=big?14:12;
  const cx=W/2, cy=Math.floor((2+H-1)/2);
  for(let attempt=0; attempt<21; attempt++){
    const rnd=mulberry32(seed*31+attempt*7919+1);
    const map=new Uint8Array(W*H);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(x===0||y<=1||x===W-1||y===H-1) map[y*W+x]=1;
    for(const d in doors) for(const [x,y] of doorTiles(W,H,d)) map[y*W+x]=2;
    const keep=new Set();
    for(let y=cy-1;y<=cy+1;y++) for(let x=cx-2;x<=cx+1;x++) keep.add(x+','+y);
    for(const d of ['N','S','W','E']) for(const [x,y] of doorTiles(W,H,d)){
      for(let k=1;k<=2;k++){ const ix = d==='W'?x+k : d==='E'?x-k : x; const iy = d==='N'?2+k-1 : d==='S'?y-k : y; keep.add(ix+','+iy); }
    }
    const spikes=[];
    if(attempt<20 && type!=='shop' && type!=='treasure'){
      const nObs = 2+Math.floor(rnd()*4);
      for(let i=0;i<nObs;i++){
        const big2 = rnd()<0.35;
        const tx = 2+Math.floor(rnd()*(cx-3)), ty = 3+Math.floor(rnd()*(H-6));
        const val = big2 ? 1 : (rnd()<0.5?1:4);
        const cells=[];
        for(let yy=0;yy<(big2?2:1);yy++) for(let xx=0;xx<(big2?2:1);xx++){ cells.push([tx+xx,ty+yy]); cells.push([W-1-(tx+xx),ty+yy]); }
        if(cells.some(([x,y])=>keep.has(x+','+y)||map[y*W+x]!==0)) continue;
        for(const [x,y] of cells) map[y*W+x]=val;
        if(!floodOK(map,W,H,cx,cy)) for(const [x,y] of cells) map[y*W+x]=0;   // vật cản gây cô lập → bỏ
      }
      if(type==='combat' && rnd()<0.5){
        const sx=2+Math.floor(rnd()*(W-4)), sy=3+Math.floor(rnd()*(H-6));
        for(let yy=0;yy<2;yy++) for(let xx=0;xx<2;xx++){ const x=sx+xx,y=sy+yy; if(map[y*W+x]===0&&!keep.has(x+','+y)) spikes.push([x,y]); }
      }
    }
    if(!floodOK(map,W,H,cx,cy)) continue;
    const torches=[];
    for(const x of [3, W-4, Math.floor(W/4), W-1-Math.floor(W/4)]) if(map[1*W+x]===1 && !torches.includes(x)) torches.push(x);
    return {W,H,map,spikes,torches,cx,cy, x0:TS, y0:2*TS, x1:(W-1)*TS, y1:(H-1)*TS, attempt};
  }
  throw new Error('buildRoom failed');
}

// ===== 7. BULLET PATTERNS (hàm thuần: origin,target,... → danh sách đạn) =====
const PATTERNS = {
  // n viên quạt nhắm vào mục tiêu
  aimed(o,t,n,spreadDeg,spd){ const a=Math.atan2(t.y-o.y,t.x-o.x), out=[], sp=spreadDeg*Math.PI/180;
    for(let i=0;i<n;i++){ const k = n===1?0:(i/(n-1)-0.5)*sp; out.push({x:o.x,y:o.y,vx:Math.cos(a+k)*spd,vy:Math.sin(a+k)*spd}); } return out; },
  // vòng tròn n viên
  ring(o,n,spd,off){ const out=[]; for(let i=0;i<n;i++){ const a=(off||0)+i/n*Math.PI*2; out.push({x:o.x,y:o.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd}); } return out; },
  // xoắn ốc: arms tay, góc quay theo thời gian t
  spiral(o,arms,rot,t,spd){ const out=[]; for(let i=0;i<arms;i++){ const a=t*rot+i/arms*Math.PI*2; out.push({x:o.x,y:o.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd}); } return out; },
  // loạt k viên cùng hướng (tách thời gian bởi delay)
  burst(o,t,k,spd,delay){ const a=Math.atan2(t.y-o.y,t.x-o.x), out=[]; for(let i=0;i<k;i++) out.push({x:o.x,y:o.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,delay:i*delay}); return out; },
  // vòng đạn có khe hở rộng gapN viên
  wall(o,n,spd,gapAt,gapN){ const out=[]; for(let i=0;i<n;i++){ if(((i-gapAt)%n+n)%n<gapN) continue; const a=i/n*Math.PI*2; out.push({x:o.x,y:o.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd}); } return out; },
  // đạn đuổi chậm
  homing(o,t,n,spd,turn){ return PATTERNS.aimed(o,t,n,60,spd).map(b=>(b.homing=turn,b)); }
};

function selfTest(){
  const log=[]; const ok=(c,m)=>{ log.push((c?'OK   ':'FAIL ')+m); if(!c) throw new Error(m); };
  // (A) mọi sprite validate + bake ở 4 biome

    const t=synthHD('floor_a',SPRITES.floor_a.rows,{...PAL,...BIOMES.chem_plant},{tile:true}); ok(t.W===16*SCALE_UNIT,'pixel tile '+16*SCALE_UNIT);
    // ảnh pixel art của bạn: đúng lưới, đủ màu, đúng kích thước
    for(const [n,a] of Object.entries(ART)){ validate(n,a.rows); const nd=synthNative(n,a.rows,a.pal,a.k); ok(nd.W===a.rows[0].length*a.k&&nd.H===a.rows.length*a.k,'art '+n+' '+a.rows[0].length+'x'+a.rows.length+' k'+a.k);
      for(const fr of ['a','b']){ const f=artWalk(a.rows,fr); validate(n+fr,f); } }
    for(const h of ['knight','wizard','paladin','pyromancer','vampire_noctis','frost_valkyrie','plague_chemist','cyber_scientist','hazmat_commando']) ok(ART['a_'+h]&&ART['u_'+h]&&ART['a_'+h].mx!==undefined,'new art '+h+' (armed+unarmed)');
    ok(ART.pet2&&ART.w_hammer,'pet cat + war hammer art');
    ok(ART.kage&&ART.katana&&ART.katana_h&&ART.venom_armed&&ART.tesla_armed&&ART.bio9_armed,'custom ninja + concept heroes present');
    { let worst2=0; const w=ART.katana; for(let i=0;i<360;i++){ const a=i/360*Math.PI*2-Math.PI, h={x:50,y:50}, p=muzzlePos(h,a,w,1), q=drawnPixelPos(h,a,w,1,w.mx,w.my); worst2=Math.max(worst2,Math.hypot(p.x-q.x,p.y-q.y)); }
      ok(worst2<1e-9,'muzzle formula matches for diagonal katana (rot0)'); }
    let bad=false; try{ synthHD('x',['K?'],PAL); }catch(e){ bad=true; } ok(bad,'HD rejects unknown key'); }
  // (B) người/quái ghép đúng 16x16 ở 3 khung
  for(const k in HUMAN.HEADS) for(const fr of ['idle','a','b']){ const f=composeHuman(HUMAN,HUMAN.HEADS[k],HUMAN.CLASS_REMAP[k],fr); validate(k,f); bake(k,f,PAL); ok(f.length===16&&f[0].length===16,'hero '+k+' '+fr); }
  for(const k in HUMAN.EHEADS) for(const fr of ['idle','a','b']){ const f=composeHuman(HUMAN,HUMAN.EHEADS[k],HUMAN.EREMAP[k],fr); validate(k,f); bake(k,f,PAL); ok(f.length===16&&f[0].length===16,'enemy '+k+' '+fr); }
  for(const k in ACTORS) for(const fr of ['idle','a','b']){ const f=actorFrame(ACTORS[k],fr); validate(k,f); for(const b of Object.keys(BIOMES)) bake(k,f,{...PAL,...BIOMES[b]}); ok(f.length===16&&f[0].length===16,'new hero '+k+' '+fr); }
  for(const k in ACTORS){ const px2=a=>a.join('').replace(/\./g,'').length; ok(px2(deadRows(ACTORS[k]))===px2(ACTORS[k]),'dead frame '+k); }
  for(const [n,s2] of Object.entries(Object.assign({},NEW_PROPS,NEW_WEAPON_SPRITES))){ validate(n,s2.rows); bake(n,s2.rows,PAL); ok(s2.ax<s2.rows[0].length&&s2.ay<s2.rows.length,'new sprite '+n+' '+s2.rows[0].length+'x'+s2.rows.length); }
  for(const ch in FONT){ const r=FONT[ch].split('/'); ok(r.length===5&&r.every(x=>x.length===3),'font '+JSON.stringify(ch)); }
  // (E) DEAD frame + rotate90
  const hero=composeHuman(HUMAN,HUMAN.HEADS.knight,{}, 'idle');
  const px=a=>a.join('').replace(/\./g,'').length;
  ok(px(deadRows(hero))===px(hero),'dead frame keeps all pixels');
  ok(rotate90(rotate90(rotate90(rotate90(hero)))).join()===hero.join(),'rotate90 x4 = identity');
  ok(px(rotate90(SPRITES.goblin_king.rows))===px(SPRITES.goblin_king.rows),'rotate90 keeps pixels (32x32)');
  // (F) đầu nòng
  let worst=0; for(const k of ['w_pistol','w_smg','w_shotgun','w_laser','w_staff','w_bow','w_sword','w_flame_staff','w_blood_signet','w_blood_katana']){ const w=SPRITES[k]||NEW_WEAPON_SPRITES[k];
    for(const rc of [0,2]) for(let i=0;i<360;i++){ const a=i/360*Math.PI*2-Math.PI, h={x:100,y:60}, p=muzzlePos(h,a,w,rc), q=drawnPixelPos(h,a,w,rc,w.mx,w.my);
      worst=Math.max(worst,Math.hypot(p.x-q.x,p.y-q.y)); } }
  ok(worst<1e-9,'muzzle formula matches drawn muzzle (720 angles x 10 weapons)');
  // (C) 200 tầng: liên thông, 1 boss, không chồng, cửa đối xứng
  const OPP={N:'S',S:'N',E:'W',W:'E'}, DV={N:[0,-1],S:[0,1],E:[1,0],W:[-1,0]};
  let floorsOK=true, roomsOK=true, shopOK=true;
  for(let s=1;s<=200;s++){
    const f=genFloor(s, 5+(s%2));
    if(f.rooms.filter(r=>r.type==='boss').length!==1) floorsOK=false;
    if(f.rooms.filter(r=>r.type==='shop').length!==1||f.depth.length!==f.rooms.length) shopOK=false;
    if(f.depth.some(d=>d<0)) floorsOK=false;
    const pos=new Set(f.rooms.map(r=>r.gx+','+r.gy)); if(pos.size!==f.rooms.length) floorsOK=false;
    for(const r of f.rooms) for(const d in r.doors){ const o=f.rooms[r.doors[d]]; if(o.doors[OPP[d]]!==r.id) floorsOK=false; if(o.gx!==r.gx+DV[d][0]||o.gy!==r.gy+DV[d][1]) floorsOK=false; }
    for(const r of f.rooms){ const R=buildRoom(s*13+r.id, r.type, r.doors);
      if(!floodOK(R.map,R.W,R.H,R.cx,R.cy)) roomsOK=false;
      for(const d in r.doors) for(const [x,y] of doorTiles(R.W,R.H,d)) if(R.map[y*R.W+x]!==2) roomsOK=false; }
  }
  ok(floorsOK,'200 floors: connected, 1 boss, no overlap, symmetric doors');
  ok(roomsOK,'all rooms flood-fill connected, doors open');
  ok(shopOK,'200 floors: every floor has exactly 1 shop (skill pedestal)');
  // (D) không xuyên tường khi bị đẩy 500 bước
  { const R=buildRoom(7,'combat',{N:1,S:2}); let pass=true;
    for(const [vx,vy] of [[3,0],[-3,0],[0,3],[0,-3],[2.5,1.7],[-4,-4]]){ const e={x:R.cx*16+8,y:R.cy*16+8,hw:5,hh:3};
      for(let i=0;i<500;i++){ moveEntity(e,vx,vy,R.map,R.W,R.H); if(overlapsSolid(e,R.map,R.W,R.H)) pass=false; } }
    ok(pass,'entity never enters wall after 500 pushes'); }
  // (G) hasLOS + insideEnough
  { const W=5,H=3,m=new Uint8Array(W*H); m[1*W+2]=1;
    ok(!hasLOS(8,24,72,24,m,W,H),'hasLOS blocked by wall');
    ok(hasLOS(8,8,72,8,m,W,H),'hasLOS clear when no wall');
    const room={x0:16,y0:32,x1:304,y1:176};
    ok(!insideEnough(20,100,room)&&insideEnough(40,100,room)&&!insideEnough(160,40,room)&&insideEnough(160,56,room),'insideEnough threshold 24px'); }
  // Patterns
  ok(PATTERNS.ring({x:0,y:0},16,80).length===16,'pattern ring(16)');
  ok(PATTERNS.wall({x:0,y:0},24,80,3,4).length===20,'pattern wall gap');
  ok(PATTERNS.aimed({x:0,y:0},{x:10,y:0},5,30,80).length===5,'pattern aimed(5)');
  ok(PATTERNS.burst({x:0,y:0},{x:1,y:0},3,80,0.1)[2].delay>0.19,'pattern burst delay');
  ok(shrinkRows(SPRITES.slime.rows.map(r=>r+[...r].reverse().join('')),0.6).length===7,'mini slime shrink');
  if(typeof extraTests==='function') extraTests(ok);   // sprite/vũ khí/lá bài mới
  return log;
}

// ----- Phông chữ pixel 3×5 (có cache) -----
const FONTB={}; for(const ch in FONT) FONTB[ch]=FONT[ch].split('/');
const textCache=new Map();
const TEXT_K=SCALE_UNIT;                          // chữ dựng đúng lưới pixel game
// Vẽ chuỗi vào canvas HD (viền đen lệch +1,+1 đơn vị, góc chữ bo nhẹ)
function textCanvas(str,col,sc,outline){
  const key=str+'|'+col+'|'+sc+'|'+outline;
  let c=textCache.get(key); if(c){ textCache.delete(key); textCache.set(key,c); return c; }   // [PLAN FX-35] LRU: trúng cache → chuyển xuống cuối (mới dùng nhất)
  while(textCache.size>=300) textCache.delete(textCache.keys().next().value);       // [PLAN FX-35] đầy: chỉ xoá mục cũ nhất (Map giữ thứ tự chèn), không clear() cả bảng
  const K=TEXT_K*sc, w=Math.max(1,str.length*4), h=6;
  c=newCanvas((w+1)*K,h*K); const cg=c.getContext('2d');
  const pass=(dx,dy,color)=>{ cg.fillStyle=color; for(let i=0;i<str.length;i++){ const gl=FONTB[str[i]]||FONTB['?'];
    for(let y=0;y<5;y++) for(let x=0;x<3;x++) if(gl[y][x]==='X'){ const X=(i*4+x)*K+dx, Y=y*K+dy, r=Math.max(1,K*0.18);
      cg.fillRect(X,Y,K,K); } } };
  if(outline) pass(Math.max(1,K/2),Math.max(1,K/2),'#1a1425');
  pass(0,0,col); c.hd=TEXT_K; textCache.set(key,c); return c;
}
// Vẽ chữ (tự động in hoa)
function text(str,x,y,col,sc,align,outline){
  str=String(str).toUpperCase().replace(/&/g,'+'); sc=sc||1; col=col||'#ffffff';
  const c=textCanvas(str,col,sc,outline!==false);
  let dx=x; if(align==='center') dx=x-(str.length*4*sc-sc)/2; else if(align==='right') dx=x-(str.length*4*sc-sc);
  g.drawImage(c,Q(dx),Q(y),c.width/TEXT_K,c.height/TEXT_K);
}
function textW(str,sc){ return String(str).length*4*(sc||1)-(sc||1); }

// ----- Âm thanh WebAudio -----
let AC=null, master=null, musicGain=null, voices=0, noiseBuf=null;
// Tạo AudioContext sau cử chỉ đầu tiên
function initAudio(){
  try{
    if(!AC){ const Ctor=window.AudioContext||window.webkitAudioContext; if(!Ctor) return; AC=new Ctor();
      master=AC.createGain(); master.gain.value=0.25; master.connect(AC.destination);
      musicGain=AC.createGain(); musicGain.gain.value=0.35; musicGain.connect(master);
      noiseBuf=AC.createBuffer(1,AC.sampleRate*0.6,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    if(AC.state==='suspended') AC.resume();
  }catch(e){ AC=null; }
}
// Một nốt oscillator có envelope
function tone(type,f0,f1,dur,vol,delay,dest){
  if(!AC||SAVE.muted) return; if(!dest && voices>=8) return;
  const t=AC.currentTime+(delay||0), o=AC.createOscillator(), gn=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t); if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  gn.gain.setValueAtTime(vol,t); gn.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(gn); gn.connect(dest||master); o.start(t); o.stop(t+dur+0.02);
  if(!dest) voices++;
  o.onended=()=>{ if(!dest) voices--; try{ o.disconnect(); gn.disconnect(); }catch(_){} };   // [AUDIT A2] tháo node sau khi phát xong
}
// Tiếng nhiễu (noise) qua lọc thông thấp
function noise(dur,vol,freq){
  if(!AC||SAVE.muted||voices>=8) return; voices++;
  const t=AC.currentTime, s=AC.createBufferSource(), f=AC.createBiquadFilter(), gn=AC.createGain();
  s.buffer=noiseBuf; f.type='lowpass'; f.frequency.value=freq||3000;
  gn.gain.setValueAtTime(vol,t); gn.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f); f.connect(gn); gn.connect(master); s.start(t); s.stop(t+dur+0.02); s.onended=()=>{ voices--; try{ s.disconnect(); f.disconnect(); gn.disconnect(); }catch(_){} };
}
// Hiệu ứng âm theo tên
function sfx(type){
  switch(type){
    case 'shoot': tone('square',880,440,0.06,0.18); break;
    case 'hit': noise(0.04,0.25,4000); break;
    case 'enemyDie': tone('sawtooth',300,60,0.18,0.22); break;
    case 'coin': tone('square',988,988,0.045,0.12); tone('square',1319,1319,0.05,0.12,0.045); break;
    case 'chestOpen': [523,659,784].forEach((f,i)=>tone('square',f,f,0.08,0.15,i*0.07)); break;
    case 'hurt': tone('square',200,80,0.15,0.25); break;
    case 'bossRoar': noise(0.6,0.35,600); tone('sawtooth',70,55,0.6,0.3); break;
    case 'door': noise(0.25,0.3,500); break;
    case 'click': tone('square',120,120,0.03,0.2); break;
    case 'ready': tone('triangle',880,1320,0.1,0.14); tone('triangle',1320,1760,0.08,0.1,0.08); break;
    case 'swing': noise(0.07,0.18,2500); break;
    case 'skill': tone('triangle',440,880,0.2,0.25); break;

// Nhạc nền chiptune: bè giai điệu vuông + bass tam giác, lặp 8 ô nhịp
const MUSIC={
  calm:{bpm:120, root:57, mel:[0,3,7,10,7,3,0,-2, 0,3,7,12,10,7,3,5, 3,7,10,14,12,10,7,5, 3,2,0,-2,0,3,7,3, 0,3,7,10,7,3,0,-2, 5,8,12,15,12,8,5,3, 2,5,7,10,7,5,2,0, -2,0,2,3,-1,-1,0,-1], bass:[0,0,-4,-4,-7,-7,-5,-5]},
  boss:{bpm:150, root:45, mel:[0,0,12,0,11,0,10,0, 0,0,12,0,13,12,10,7, 0,0,12,0,11,0,10,0, 3,3,15,3,14,12,10,7, 0,1,0,1,0,1,3,1, 0,1,0,1,7,6,5,3, 0,0,12,0,11,0,10,0, 12,10,7,6,5,3,1,0], bass:[0,0,1,1,0,0,-2,-1]}
};
let musicKind=null, musicStep=0, musicNext=0;
// Đổi bản nhạc
function setMusic(kind){ if(musicKind!==kind){ musicKind=kind; musicStep=0; if(AC) musicNext=AC.currentTime+0.05; } }
// Lên lịch nốt nhạc trước ~0.2s
function musicTick(){
  if(!AC||SAVE.muted||!musicKind) return;
  const m=MUSIC[musicKind], step=60/m.bpm/2;
  if(musicNext<AC.currentTime) musicNext=AC.currentTime+0.02;
  while(musicNext<AC.currentTime+0.2){
    const i=musicStep%64, n=m.mel[i];
    if(n>-1||n<-1) tone('square',440*Math.pow(2,(m.root+12+n-69)/12),440*Math.pow(2,(m.root+12+n-69)/12),step*0.9,0.06,musicNext-AC.currentTime,musicGain);
    if(i%2===0){ const b=m.bass[Math.floor(i/8)]; const f=440*Math.pow(2,(m.root-12+b-69)/12); tone('triangle',f,f,step*1.8,0.12,musicNext-AC.currentTime,musicGain); }
    musicStep++; musicNext+=step;
  }
}
setInterval(musicTick,80);

// Đổi tọa độ pointer sang tọa độ logic 320×180
function toLogical(e){ const r=screenC.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*VW, y:(e.clientY-r.top)/r.height*VH}; }
const TBTN={fire:{x:286,y:144,r:26}, skill:{x:246,y:160,r:13}, swap:{x:302,y:104,r:11}, pause:{x:160,y:8,r:8}};
// Đặt nút cảm ứng bám góc màn hình (khung nhìn logic thay đổi theo tỉ lệ)
function layoutTouch(){ Object.assign(TBTN.fire,{x:VW-34,y:VH-36}); Object.assign(TBTN.skill,{x:VW-74,y:VH-20}); Object.assign(TBTN.swap,{x:VW-18,y:VH-76}); Object.assign(TBTN.pause,{x:VW-64,y:9}); }
touchReady=true; layoutTouch();
function inCircle(p,b){ return Math.hypot(p.x-b.x,p.y-b.y)<=b.r; }
screenC.addEventListener('pointerdown',e=>{
  e.preventDefault(); initAudio(); const p=toLogical(e); ptr.x=p.x; ptr.y=p.y; ptr.click=true;
  if(e.pointerType==='touch'||e.pointerType==='pen'){ isTouch=true;
    if(state==='play'){
      if(inCircle(p,TBTN.pause)) { pressed.Escape=true; return; }
      if(inCircle(p,TBTN.skill)) { pressed.KeyK=true; return; }
      if(inCircle(p,TBTN.swap)) { pressed.KeyQ=true; return; }
      if(inCircle(p,TBTN.fire)) { if(nearInteract) pressed.KeyE=true; else { touch.fire=true; touch.fireId=e.pointerId; } return; }
      if(p.x<VW*0.5 && touch.joyId===null){ touch.joyId=e.pointerId; touch.joy={bx:p.x,by:p.y,x:p.x,y:p.y}; }
    }
  } else if(e.button===0){ mouseDown=true; if(state==='play') lockPointer(); }
  try{ screenC.setPointerCapture(e.pointerId); }catch(_){}
},{passive:false});
screenC.addEventListener('pointermove',e=>{ const p=toLogical(e); ptr.x=p.x; ptr.y=p.y; if(e.pointerId===touch.joyId&&touch.joy){ touch.joy.x=p.x; touch.joy.y=p.y; } },{passive:false});
function ptrUp(e){ if(e.pointerId===touch.joyId){ touch.joyId=null; touch.joy=null; } if(e.pointerId===touch.fireId){ touch.fire=false; touch.fireId=null; } if(e.pointerType==='mouse') mouseDown=false; }
screenC.addEventListener('pointerup',ptrUp); screenC.addEventListener('pointercancel',ptrUp);
// [AUDIT A1] Với cảm ứng, pointerdown KHÔNG phải "activation event" (chuẩn HTML) → mở khoá âm thanh thêm ở pointerup/touchend/click (iOS/Android)

// ----- Khóa chuột khi chơi (Pointer Lock): con trỏ ẩn, không chạy lung tung ra ngoài khung game -----
// Chỉ chuột trái để bắn (game tự nhắm), nên không cần vị trí con trỏ trong lúc chơi.
function lockPointer(){
  if(isTouch||document.pointerLockElement===screenC||!screenC.requestPointerLock) return;
  try{ const r=screenC.requestPointerLock(); if(r&&r.catch) r.catch(()=>{}); }catch(_){}
}
function unlockPointer(){ if(document.pointerLockElement){ try{ document.exitPointerLock(); }catch(_){} } }
// Mất khóa chuột (vd. bấm Esc) giữa trận → tạm dừng
document.addEventListener('pointerlockchange',()=>{ if(!document.pointerLockElement && state==='play'){ state='pause'; menuSel=0; mouseDown=false; } });

let lastCursor='';
// Ẩn con trỏ trong trận, hiện lại ở menu
function syncCursor(){ const c = state==='play' ? 'none' : 'pointer'; if(c!==lastCursor){ screenC.style.cursor=c; lastCursor=c; } if(state!=='play') unlockPointer(); }

// Lấy hướng di chuyển từ phím/joystick
function moveAxis(){
  let x=0,y=0;
  if(keys.KeyA||keys.ArrowLeft) x-=1; if(keys.KeyD||keys.ArrowRight) x+=1;
  if(keys.KeyW||keys.ArrowUp) y-=1; if(keys.KeyS||keys.ArrowDown) y+=1;
  if(touch.joy){ const dx=touch.joy.x-touch.joy.bx, dy=touch.joy.y-touch.joy.by, d=Math.hypot(dx,dy); if(d>2){ const m=Math.min(1,d/20); x=dx/d*m; y=dy/d*m; } }
  const l=Math.hypot(x,y); if(l>1){ x/=l; y/=l; }
  return {x,y};
}
function firing(){ return !!(keys.KeyJ||mouseDown||touch.fire); }

// Đặt đồ vật vào phòng mới (rương, shop, sóng quái)

// Cố định camera trong biên phòng
function clampCam(snap){
  const rw=R.W*TS, rh=R.H*TS;
  const tx=player.x-VW/2, ty=player.y-8-VH/2;
  if(snap){ cam.x=tx; cam.y=ty; } else { cam.x+=(tx-cam.x)*CONFIG.CAMERA_LERP; cam.y+=(ty-cam.y)*CONFIG.CAMERA_LERP; }
  cam.x = rw<=VW ? (rw-VW)/2 : Math.max(0,Math.min(rw-VW,cam.x));

// Tạo dấu X cảnh báo cho đợt quái kế tiếp

// Chọn mục tiêu gần nhất có tầm nhìn

// Thử tấn công: cận chiến / chém khi quái sát / hết energy / bắn

// Sinh đạn từ đầu nòng (muzzlePos, tay đã làm tròn)

function meleeSwing(dmg,arcDeg,range,o){

  const inArc=(x,y,extra)=>{ const d=dist(cx,cy,x,y); if(d>range+extra) return false; let da=Math.atan2(y-cy,x-cx)-p.aim; da=Math.atan2(Math.sin(da),Math.cos(da)); return Math.abs(da)<=half||d<8; };
  if(o.col2) fx[fx.length-1].col2=o.col2;
  if(o.blood) for(let i=0;i<6;i++){ const a=p.aim+rr(-half,half), rad=range-rr(2,5);      // huyết kiếm: mỗi nhát văng giọt máu pixel

  for(const e of enemies) if(e.hp>0 && e.spawnT<=0 && inArc(e.x,e.y-e.bo,e.r)){ const crit=Math.random()*100<p.crit+(o.crit||0)+run.critAdd; damageEnemy(e,crit?dmg*2:dmg,crit);

  e.hp=0; room.alive=Math.max(0,room.alive-1); run.kills++;

  if(e.boss){ bossDeath(e); return; }
  const mul=e.champion?3:1;

// AI quái mỗi bước
function updateEnemy(e,dt){
  e.flash=Math.max(0,e.flash-dt); e.anim+=dt;
  if(e.burn>0){ e.burn-=dt; e.burnT=(e.burnT||0)-dt; if(Math.random()<0.3) part(e.x+rr(-4,4),e.y-e.bo+rr(-4,4),0,-25,0.35,pick(['#ff9b30','#ffd93d','#ee4455']),1);
    if(e.burnT<=0){ e.burnT=0.5; damageEnemy(e,1,false,'#ff9b30'); if(e.hp<=0) return; } }
  // độc axit (xanh), làm chậm (băng), đóng băng
  if(e.poison>0){ e.poison-=dt; e.poisonT=(e.poisonT||0)-dt; if(Math.random()<0.3) part(e.x+rr(-4,4),e.y-e.bo+rr(-4,4),0,-18,0.4,pick(['#92ea5e','#44b545']),1);
    if(e.poisonT<=0){ e.poisonT=0.5; damageEnemy(e,1,false,'#92ea5e'); if(e.hp<=0) return; } }
  if(e.chill>0){ e.chill-=dt; if(Math.random()<0.15) part(e.x+rr(-5,5),e.y-e.bo+rr(-5,5),0,8,0.4,'#bfeaf5',1); }
  if(e.frozen>0) e.frozen-=dt;
  if(e.spawnT>0){ e.spawnT-=dt; return; }
  if(e.stun>0){ e.stun-=dt; return; }
  if(e.boss){ updateBoss(e,dt); return; }
  const px=player.x, py=player.y, ox=e.x, oy=e.y-e.bo, d=dist(ox,oy,px,py-6);
  const toP=Math.atan2(py-e.y,px-e.x);
  const los=hasLOS(ox,oy,px,py-6,R.map,R.W,R.H);
  const O={x:ox,y:oy}, T={x:px,y:py-6};
  let vx=0, vy=0; e.atk-=dt; e.t+=dt;
  switch(e.ai){
    case 'kite': case 'kite2': {
      const s=e.spd; if(d>110){ vx=Math.cos(toP)*s; vy=Math.sin(toP)*s; } else if(d<70){ vx=-Math.cos(toP)*s; vy=-Math.sin(toP)*s; }
      else { vx=Math.cos(toP+Math.PI/2*e.side)*s*0.7; vy=Math.sin(toP+Math.PI/2*e.side)*s*0.7; if(Math.random()<0.01) e.side*=-1; }
      if(e.atk<=0 && los && d<170){ e.atk=e.d.cd; if(e.ai==='kite') enemyFire(PATTERNS.aimed(O,T,1,0,ES(1)),O,'b_red'); else enemyFire(PATTERNS.homing(O,T,2,ES(0.75),1.6),O,'b_purple',{life:3.5}); }
      break; }
    case 'flee': {
      const s=e.spd; if(d<70){ vx=-Math.cos(toP)*s; vy=-Math.sin(toP)*s; } else { vx=Math.cos(e.t*0.8+e.side)*s*0.5; vy=Math.sin(e.t*0.6)*s*0.5; }
      if(e.atk<=0 && los && d<170){ e.atk=e.d.cd; enemyFire(PATTERNS.aimed(O,T,3,30,ES(0.9)),O,'b_red'); }
      break; }
    case 'chase': {
      if(d>18){ vx=Math.cos(toP)*e.spd; vy=Math.sin(toP)*e.spd; }
      if(e.atk<=0 && d<150){ e.atk=e.d.cd; enemyFire(PATTERNS.ring(O,8,ES(0.85),Math.random()),O,'b_orange'); }
      break; }
    case 'elite': {
      if(e.state==='dash'){ e.st-=dt; vx=e.dvx; vy=e.dvy; if(e.st<=0) e.state='move'; }
      else { if(d>20){ vx=Math.cos(toP)*e.spd; vy=Math.sin(toP)*e.spd; }
        if(e.atk<=0){ e.atk=e.d.cd;
          if(d<34){ fx.push({kind:'eslash',x:ox,y:oy,a:Math.atan2(T.y-oy,T.x-ox),t:0.2}); if(d<30) hurtPlayer(2); }
          else if(los) enemyFire(PATTERNS.aimed(O,T,5,50,ES(0.95)),O,'b_red');
          if(Math.random()<0.5){ e.state='dash'; e.st=0.3; e.dvx=Math.cos(toP)*150; e.dvy=Math.sin(toP)*150; } } }
      break; }
    case 'charge': {
      if(e.state==='move'){ vx=Math.cos(toP)*e.spd*0.6+Math.cos(e.t)*10; vy=Math.sin(toP)*e.spd*0.6; if(e.atk<=0 && los && d<150){ e.state='warn'; e.st=0.5; e.dir=toP; } }
      else if(e.state==='warn'){ e.st-=dt; if(e.st<=0){ e.state='dash'; e.st=1.2; } }
      else if(e.state==='dash'){ e.st-=dt; const sx=e.x, sy=e.y, s=140; moveEntity(e,Math.cos(e.dir)*s*dt,Math.sin(e.dir)*s*dt,R.map,R.W,R.H);
        if(Math.hypot(e.x-sx,e.y-sy)<s*dt*0.5){ e.state='move'; e.stun=1; e.atk=e.d.cd; shake=Math.max(shake,1.5); burst(e.x,e.y-4,6,'#c98655',40,0.3); }
        else if(e.st<=0){ e.state='move'; e.atk=e.d.cd; }
        e.facing=Math.cos(e.dir)<0?-1:1; e.moving=true; touchDamage(e); return; }
      break; }
    case 'hop': {
      if(e.state==='move'){ if(e.atk<=0){ e.state='hop'; e.st=0.35; e.dir=toP+rr(-0.4,0.4); e.atk=e.d.cd; } }
      else { e.st-=dt; vx=Math.cos(e.dir)*e.spd*3; vy=Math.sin(e.dir)*e.spd*3; if(e.st<=0) e.state='move'; }
      break; }
    case 'bat': {
      const orbit=e.t*1.3*e.side, tx=px+Math.cos(orbit)*60, ty=py-10+Math.sin(orbit)*40, a=Math.atan2(ty-e.y,tx-e.x);
      vx=Math.cos(a)*e.spd+Math.cos(e.t*6)*25; vy=Math.sin(a)*e.spd+Math.sin(e.t*7)*25;
      if(e.atk<=0 && los){ e.atk=e.d.cd; enemyFire(PATTERNS.aimed(O,T,1,0,ES(1.35)),O,'b_orange'); }
      break; }
    case 'hover': {
      if(d>100){ vx=Math.cos(toP)*e.spd; vy=Math.sin(toP)*e.spd; } else if(d<80){ vx=-Math.cos(toP)*e.spd; vy=-Math.sin(toP)*e.spd; } else { vx=Math.cos(e.t)*15; vy=Math.sin(e.t*1.3)*15; }
      if(e.atk<=0 && los){ e.atk=e.d.cd; enemyFire(PATTERNS.burst(O,T,3,ES(1.2),0.12),O,'b_orange'); }
      break; }
    case 'turret': {
      if(e.state==='move'){ if(e.atk<=0){ e.state='fire'; e.st=1.5; e.sp=0; } }
      else { e.st-=dt; e.sp-=dt; e.spin+=dt*3.2; if(e.sp<=0){ e.sp=0.12; enemyFire(PATTERNS.spiral(O,2,1,e.spin,ES(0.8)),O,'b_red'); } if(e.st<=0){ e.state='move'; e.atk=2; } }
      break; }
  }
  if(e.chill>0){ vx*=0.5; vy*=0.5; }
  if(vx||vy){ moveEntity(e,vx*dt,vy*dt,R.map,R.W,R.H); e.moving=true; if(Math.abs(vx)>2) e.facing=vx<0?-1:1; } else e.moving=false;
  if(e.ai==='kite'||e.ai==='flee'||e.ai==='kite2') e.facing=px<e.x?-1:1;
  touchDamage(e);
}
// Sát thương chạm
function touchDamage(e){ const gs=giantScale(player); if(e.d.touch && !player.dead && dist(e.x,e.y-e.bo,player.x,player.y-6*gs)<e.r+4*gs) hurtPlayer(e.d.touch); }
// Đẩy quái tách nhau nhẹ
function separate(){
  for(let i=0;i<enemies.length;i++) for(let j=i+1;j<enemies.length;j++){ const a=enemies[i], b=enemies[j]; if(a.boss||b.boss) continue;
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1, m=a.r+b.r-2; if(d<m){ const p=(m-d)/2; moveEntity(a,-dx/d*p,-dy/d*p,R.map,R.W,R.H); moveEntity(b,dx/d*p,dy/d*p,R.map,R.W,R.H); } }
}

function spawnBoss(){
  const B=BOSSES[run.floor], hp=Math.round(B.hp*(1+0.04*run.level));
  const e={type:B.id,sprKey:'boss_'+run.floor,boss:true,B,d:{col:'#ee4455',r:13},x:R.cx*TS,y:(R.cy-1)*TS,hw:10,hh:4,bo:14,r:13,hp,maxHp:hp,spd:B.spd,phase:1,freeze:0,
    t:0,spawnT:0.6,flash:0,facing:-1,stun:0,state:'move',st:0,timers:{a:2,b:4,c:6,d:8,e:3},spin:0,spinDir:1,alpha:1,anim:0,moving:false,lasers:[]};
  enemies.push(e); shake=3; burst(e.x,e.y-14,30,'#ee4455',90,0.6,2);
}
// Chuyển pha khi HP ≤ 50%
function checkBossPhase(e){
  if(e.phase===1 && e.hp>0 && e.hp<=e.maxHp/2){ e.phase=2; e.freeze=0.8; shake=4; whiteFlash=1; sfx('bossRoar');
    for(let i=0;i<10;i++) dropItem('orb',e.x,e.y-10);
    if(e.type==='skeleton_lord'){ for(let i=0;i<4;i++){ room.alive++; fx.push({kind:'spawn',x:R.cx*TS+(i%2?60:-60),y:(R.cy+(i<2?-2:2))*TS,t:1,type:e.B.minion||'skeleton'}); } }
    e.lasers=[]; }
}
// Boss chết: slow-mo, nổ liên hoàn, rương vàng, cổng
function bossDeath(e){
  slowmo=0.8; hitStop=3; shake=5; whiteFlash=1; run.bossKilled++;
  for(let i=0;i<10;i++) dropItem('orb',e.x,e.y-10);
  for(let i=0;i<20;i++) dropItem('coin',e.x,e.y-10);
  for(let i=0;i<6;i++) fx.push({kind:'boom',x:e.x+rr(-16,16),y:e.y-rr(0,28),t:0.2+i*0.12,done:false});
  for(const o of enemies) if(o!==e && o.hp>0){ o.hp=0; burst(o.x,o.y-6,8,o.d.col,60,0.4); }
  room.alive=0; for(const b of BUL) if(b.owner==='e') b.a=false;
  fx=fx.filter(f=>f.kind!=='spawn'&&f.kind!=='meteor'&&f.kind!=='bacid');
  items.push({kind:'chest',x:R.cx*TS-24,y:R.cy*TS+20,open:false,gold:true});
  items.push({kind:'scroll',x:R.cx*TS+24,y:R.cy*TS+20});
  items.push({kind:'portal',x:R.cx*TS,y:(R.cy-2)*TS,t:0});
  setMusic('calm');
}
// AI boss
function updateBoss(e,dt){
  if(e.freeze>0){ e.freeze-=dt; return; }
  const P2=e.phase===2, sp=e.spd*(P2?1.4:1), T=e.timers; for(const k in T) T[k]-=dt*(P2?1.25:1);
  const px=player.x, py=player.y-6, O={x:e.x,y:e.y-e.bo}, TG={x:px,y:py}, d=dist(O.x,O.y,px,py), toP=Math.atan2(py-O.y,px-O.x);
  e.t+=dt; let vx=0, vy=0;
  if(e.state==='dash'){ e.st-=dt; const sx=e.x, sy=e.y; moveEntity(e,e.dvx*dt,e.dvy*dt,R.map,R.W,R.H); e.moving=true; e.facing=e.dvx<0?-1:1;
    if(e.st<=0 || Math.hypot(e.x-sx,e.y-sy)<Math.hypot(e.dvx,e.dvy)*dt*0.4){ e.state='move'; shake=Math.max(shake,2); if(e.type==='goblin_king') enemyFire(PATTERNS.ring(O,12,ES(0.8)),O,'b_red',{force:true}); }
    if(dist(e.x,e.y-e.bo,player.x,player.y-6*giantScale(player))<e.r+4*giantScale(player)) hurtPlayer(2); return; }
  if(e.state==='warn'){ e.st-=dt; if(e.st<=0){ e.state='dash'; e.st=e.type==='sky_overlord'?1.4:0.9; const s=e.type==='sky_overlord'?200:170; e.dvx=Math.cos(e.dir)*s; e.dvy=Math.sin(e.dir)*s; } return; }
  if(e.state==='tele'){ e.st-=dt; e.alpha=Math.max(0,e.st/0.4); if(e.st<=0){ let x,y,k=0; do{ x=rr(2,R.W-2)*TS; y=rr(3,R.H-2)*TS; k++; }while(k<40&&(dist(x,y,player.x,player.y)<80||overlapsSolid({x,y,hw:10,hh:4},R.map,R.W,R.H))); if(k<40){ e.x=x; e.y=y; } e.state='appear'; e.st=0.4; } return; }
  if(e.state==='appear'){ e.st-=dt; e.alpha=1-Math.max(0,e.st/0.4); if(e.st<=0){ e.state='move'; e.alpha=1; enemyFire(PATTERNS.aimed(O,TG,5,50,ES(0.9)),O,'b_purple'); } return; }
  // di chuyển giữ khoảng cách 60–110
  if(d>110){ vx=Math.cos(toP)*sp; vy=Math.sin(toP)*sp; } else if(d<60){ vx=-Math.cos(toP)*sp; vy=-Math.sin(toP)*sp; } else { vx=Math.cos(toP+Math.PI/2)*sp*0.5*Math.sin(e.t*0.7); vy=Math.sin(toP+Math.PI/2)*sp*0.5*Math.sin(e.t*0.7); }
  if(e.type==='goblin_king'){
    if(T.a<=0){ T.a=8; for(let i=0;i<2;i++){ room.alive++; fx.push({kind:'spawn',x:e.x+(i?-30:30),y:e.y+10,t:1,type:e.B.minion||'goblin'}); } }
    if(T.b<=0){ T.b=3.5; shake=Math.max(shake,2.5); sfx('boom'); enemyFire(PATTERNS.ring(O,16,ES(0.8),e.t),O,'b_red',{force:true});
      if(P2) setTimeout0(0.3,()=>{ if(e.hp>0) enemyFire(PATTERNS.ring({x:e.x,y:e.y-e.bo},16,ES(0.8),e.t+Math.PI/16),O,'b_red',{force:true}); }); }
    if(T.c<=0){ T.c=6.5; e.state='warn'; e.st=0.5; e.dir=toP; }
    if(P2 && T.d<=0){ T.d=4; for(let i=0;i<3;i++) fx.push({kind:'meteor',x:player.x+rr(-30,30),y:player.y+rr(-20,20),t:0.8+i*0.15}); }
  } else if(e.type==='skeleton_lord'){
    e.spinDir = P2 && Math.floor(e.t/3)%2 ? -1 : 1;     // pha 2: đổi chiều mỗi 3s
    e.spin+=dt*(P2?2.4:1.1)*e.spinDir;
    if(T.a<=0){ T.a=0.16; if((e.t%5)<3) enemyFire(PATTERNS.spiral(O,P2?5:3,1,e.spin,ES(0.75)),O,'b_orange',{force:true}); }
    if(T.b<=0){ T.b=2.5; enemyFire(PATTERNS.aimed(O,TG,5,40,ES(1)),O,'b_purple'); }
    if(T.c<=0){ T.c=6.5; e.state='tele'; e.st=0.4; }
    if(P2 && T.d<=0){ T.d=3.2; enemyFire(PATTERNS.wall(O,28,ES(0.7),Math.floor(((Math.atan2(py-O.y,px-O.x)+Math.PI*2)%(Math.PI*2))/(Math.PI*2)*28)-2+ri(-3,3),5),O,'b_red',{force:true}); }
    if(P2 && T.e<=0){ T.e=15;for(let i=0;i<2;i++){ room.alive++; fx.push({kind:'spawn',x:rr(3,R.W-3)*TS,y:rr(4,R.H-3)*TS,t:1,type:e.B.minion||'skeleton'}); } }
  } else if(e.type==='mutagen_tank'){
    // MUTAGEN X-09: vòng axit, hồ axit rơi quanh người chơi, triệu hồi mutant; pha 2 thêm quạt axit nhắm
    if(T.a<=0){ T.a=P2?2.2:3; enemyFire(PATTERNS.ring(O,P2?20:14,ES(0.75),e.t),O,'bullet_acid',{force:true}); }
    if(T.b<=0){ T.b=P2?3.5:5; for(let i=0;i<(P2?3:2);i++) fx.push({kind:'bacid',x:player.x+rr(-24,24),y:player.y+rr(-16,16),t:4.3,age:0,tick:0}); }
    if(T.c<=0){ T.c=9; for(let i=0;i<2;i++){ room.alive++; fx.push({kind:'spawn',x:e.x+(i?-28:28),y:e.y+12,t:1,type:e.B.minion||'mutant'}); } }
    if(P2 && T.d<=0){ T.d=2.6; enemyFire(PATTERNS.aimed(O,TG,7,70,ES(0.95)),O,'bullet_acid'); }
  } else {
    if(T.a<=0 && !e.lasers.length){ T.a=P2?5:6;
      const base=toP-Math.PI/4; e.lasers.push({a:base,rot:(Math.PI/2)/1.5,warn:0.7,t:1.5});
      if(P2) e.lasers.push({a:base+Math.PI,rot:-(Math.PI/2)/1.5,warn:0.7,t:1.5}); }
    if(T.b<=0){ T.b=2.5; enemyFire(PATTERNS.homing(O,TG,3,ES(0.7),1.4),O,'b_purple',{life:4}); }
    if(T.c<=0 && !P2){ T.c=9; if(enemies.filter(x=>x.type==='drone'&&x.hp>0).length<2){ room.alive++; fx.push({kind:'spawn',x:e.x,y:e.y+14,t:0.8,type:'drone'}); } }
    if(P2 && T.d<=0){ T.d=2.5; enemyFire(PATTERNS.ring(O,22,ES(0.7),e.t),O,'b_red',{force:true}); }
    if(P2 && T.c<=0){ T.c=7; e.state='warn'; e.st=0.6; e.dir=toP; }
    if(e.lasers.length) { vx*=0.2; vy*=0.2; }
  }
  // tia laser quét
  for(const L of e.lasers){ if(L.warn>0){ L.warn-=dt; } else { L.t-=dt; L.a+=L.rot*dt; if(laserHits(O.x,O.y,L.a,300)) hurtPlayer(1); } }
  e.lasers=e.lasers.filter(L=>L.t>0);
  if(e.chill>0){ vx*=0.6; vy*=0.6; }
  moveEntity(e,vx*dt,vy*dt,R.map,R.W,R.H); e.moving=!!(vx||vy); e.facing=px<e.x?-1:1;
  if(dist(e.x,e.y-e.bo,player.x,player.y-6*giantScale(player))<e.r+3*giantScale(player)) hurtPlayer(1);
}
// Người chơi có nằm trên tia laser không (dừng ở tường)
function laserHits(x,y,a,len){
  const c=Math.cos(a), s=Math.sin(a), L=laserLen(x,y,a,len);
  const dx=player.x-x, dy=player.y-6-y, t=dx*c+dy*s; if(t<0||t>L) return false;
  return Math.abs(-dx*s+dy*c)<5;
}
function laserLen(x,y,a,len){ const c=Math.cos(a), s=Math.sin(a); for(let t=0;t<len;t+=4){ if(solidAt(R.map,R.W,R.H,Math.floor((x+c*t)/TS),Math.floor((y+s*t)/TS))&&t>20) return t; } return len; }
// Hẹn giờ theo thời gian game (không dùng setTimeout thật)
const timers=[];
// [PLAN FX-26] hẹn giờ gắn với phòng + lượt chơi lúc đặt. Sang phòng khác/lượt khác: huỷ; riêng opt.carry (vd. máy bán hàng
// rơi đồ) thì chạy NGAY trong phòng mới, callback nhận tham số at={x,y,carried:true} = vị trí người chơi (callback đọc toạ độ
// qua closure của phòng cũ → hàm nào hỗ trợ carry phải dùng at nếu có).
function setTimeout0(t,f,opt){ timers.push({t,f,room,run,carry:!!(opt&&opt.carry)}); }

function damageProp(i,dmg){
  R.propHp[i]=(R.propHp[i]||3)-dmg;
  if(R.propHp[i]<=0){ R.map[i]=0; R.dirty=true; const x=(i%R.W)*TS+8, y=Math.floor(i/R.W)*TS+8; propBreakEffect(i,x,y);
    burst(x,y,12,'#85522f',60,0.5,2); sfx('hit'); const r=Math.random();
    if(r<0.3) dropItem('coin',x,y); else if(r<0.75){ dropItem('orb',x,y); dropItem('orb',x,y); } else if(r<0.81) dropItem('hp',x,y); }
}
// Hỏa cầu nổ: sát thương vùng + bỏng 3s + 3 tia lửa nảy tường
function fireImpact(b){
  const rad=b.splash||22, emb=b.embers; b.embers=0;
  fx.push({kind:'boomRing',x:b.x,y:b.y,r:rad,t:0.25,col:'#ff9b30'}); burst(b.x,b.y,12,'#ff9b30',70,0.35,2); sfx('boom');
  for(const e of enemies) if(e.hp>0&&e.spawnT<=0&&dist(b.x,b.y,e.x,e.y-e.bo)<rad+e.r){ damageEnemy(e,Math.ceil(b.dmg*0.5),false,'#ff9b30'); e.burn=Math.max(e.burn||0,3); }
  for(let i=0;i<emb;i++){ const a=i/emb*Math.PI*2+rr(-0.3,0.3); playerBullet(b.x,b.y,a,rr(110,140),{spr:'bullet_ember',r:2,dmg:2,fire:3,bounce:1,life:0.45,max:0.45}); }
}
function explode(x,y,rad,dmg){
  fx.push({kind:'boomRing',x,y,r:rad,t:0.25}); burst(x,y,20,'#ff9b30',90,0.4,2); shake=Math.max(shake,2.5); if(rad>=28) whiteFlash=0.5; sfx('boom');
  for(const e of enemies) if(e.hp>0&&e.spawnT<=0&&dist(x,y,e.x,e.y-e.bo)<rad+e.r) damageEnemy(e,dmg,false);
}
function updateBullets(dt){
  for(const b of BUL){ if(!b.a) continue;
    if(b.delay>0){ b.delay-=dt; continue; }
    if(b.mx) mxTrail(b,dt);
    b.life-=dt; if(b.life<=0){ if(b.mx) mxEnd(b); if(b.aoe) explode(b.x,b.y,b.aoe,b.dmg); if(b.embers) fireImpact(b); b.a=false; continue; }
    if(b.wave){ // dơi: uốn nhẹ về quái gần nhất + lượn sóng sin
      b.age+=dt; let nt=null, nd=170; for(const e of enemies){ if(e.hp<=0||e.spawnT>0) continue; const d=dist(b.x,b.y,e.x,e.y-e.bo); if(d<nd){ nd=d; nt=e; } }
      if(nt){ let df=Math.atan2(nt.y-nt.bo-b.y,nt.x-b.x)-b.base; df=Math.atan2(Math.sin(df),Math.cos(df)); b.base+=df*Math.min(1,4*dt); }
      const wa=b.base+Math.sin(b.age*14)*0.35, sp=Math.hypot(b.vx,b.vy); b.vx=Math.cos(wa)*sp; b.vy=Math.sin(wa)*sp; }
    if(b.cutter) for(const o of BUL) if(o.a&&o.owner==='e'&&dist(o.x,o.y,b.x,b.y)<10){ o.a=false; burst(o.x,o.y,3,'#ee4455',30,0.2); }
    if(b.homing){ let tx,ty,ok=false;
      if(b.owner==='e'){ tx=player.x; ty=player.y-6; ok=true; }
      else { let best=null,bd=b.venomLock?420:120; for(const e of enemies){ if(e.hp<=0||e.spawnT>0) continue; const d=dist(b.x,b.y,e.x,e.y-e.bo); if(d<bd){bd=d;best=e;} } if(best){ tx=best.x; ty=best.y-best.bo; ok=true; } }
      if(ok){ const sp=Math.hypot(b.vx,b.vy), a=Math.atan2(b.vy,b.vx), want=Math.atan2(ty-b.y,tx-b.x); let da=Math.atan2(Math.sin(want-a),Math.cos(want-a)); const na=a+Math.max(-b.homing*dt,Math.min(b.homing*dt,da)); b.vx=Math.cos(na)*sp; b.vy=Math.sin(na)*sp; } }
    const steps=Math.max(1,Math.ceil(Math.hypot(b.vx,b.vy)*dt/4));
    for(let s=0;s<steps && b.a;s++){
      b.x+=b.vx*dt/steps; b.y+=b.vy*dt/steps;
      const tx=Math.floor(b.x/TS), ty=Math.floor(b.y/TS);
      if(tx<0||ty<0||tx>=R.W||ty>=R.H){ b.a=false; break; }
      const v=R.map[ty*R.W+tx];
      if(solidV(v) && b.bounce>0){ // đạn nảy: phản xạ đúng trục va chạm, tóe tia lửa, sáng hơn
        b.x-=b.vx*dt/steps; b.y-=b.vy*dt/steps; b.bounce--;
        const r=reflectVelocity(b.x,b.y,b.vx*dt/steps*1.5,b.vy*dt/steps*1.5,R.map,R.W,R.H); b.vx*=Math.sign(r[0])===Math.sign(b.vx)||!r[0]?1:-1; b.vy*=Math.sign(r[1])===Math.sign(b.vy)||!r[1]?1:-1;
        b.bright=1; b.hit.length=0; burst(b.x,b.y,4,'#ffd93d',50,0.2,1); if(v===4&&b.owner==='p') damageProp(ty*R.W+tx,1); continue; }
      if(solidV(v)){ if(b.mx){ b.x-=b.vx*dt/steps; b.y-=b.vy*dt/steps; mxEnd(b); } if(v===4 && b.owner==='p') damageProp(ty*R.W+tx,1); if(b.embers) { b.x-=b.vx*dt/steps; b.y-=b.vy*dt/steps; fireImpact(b); } burst(b.x-b.vx*dt/steps,b.y-b.vy*dt/steps,3,b.owner==='p'?'#ffd93d':'#ee4455',40,0.2); if(b.aoe) explode(b.x,b.y,b.aoe,b.dmg); b.a=false; break; }
      if(b.owner==='p'){
        for(const e of enemies){ if(e.hp<=0||e.spawnT>0||e.alpha<0.5) continue; if(b.hit.includes(e)) continue;
          if(dist(b.x,b.y,e.x,e.y-e.bo)<b.r+e.r){ if(b.aoe){ explode(b.x,b.y,b.aoe,b.dmg); b.a=false; break; }
            damageEnemy(e,b.dmg,b.crit); burst(b.x,b.y,3,b.fire?'#ff9b30':'#ffffff',40,0.15); if(b.mx) mxHit(b,e); hitSpark(b.x,b.y,b);
            if(b.crit && run.cards.elemental) elementalBurst(b.x,b.y,b);
            if(b.fire) e.burn=Math.max(e.burn||0,b.fire);
            if(b.chill || (b.crit && CL().chillCrit)){ e.chill=Math.max(e.chill||0,b.chill||2); if(b.crit && CL().chillCrit && b.pierce<=0){ b.pierce=1; } }  // GLACIA: chí mạng làm chậm + xuyên
            if(b.freeze){ e.stun=Math.max(e.stun||0,b.freeze); e.frozen=Math.max(e.frozen||0,b.freeze); }
            if(b.poison) e.poison=Math.max(e.poison||0,b.poison);
            if(b.shock){ let o2=null, bd=45; for(const o of enemies){ if(o===e||o.hp<=0||o.spawnT>0) continue; const dd=dist(e.x,e.y,o.x,o.y); if(dd<bd){ bd=dd; o2=o; } }
              if(o2){ damageEnemy(o2,Math.ceil(b.dmg/2),false,'#58e2f2'); fx.push({kind:'bolt',pts:[[e.x,e.y-e.bo],[o2.x,o2.y-o2.bo]],t:0.15}); } }
            if(b.drain && player.drainLeft>0 && Math.random()<0.25 && player.hp<player.maxHp){ player.drainLeft--; player.hp++; floatText(player.x,player.y-24,'+1 HP','#ee4455'); }
            if(b.embers){ fireImpact(b); b.a=false; break; }
            if(b.pierce>0){ b.pierce--; b.hit.push(e); } else { b.a=false; break; } } }
      } else {
        if(player.aegis>0 && dist(b.x,b.y,player.x,player.y-6)<14){ b.a=false; player.en=Math.min(player.maxEn,player.en+5); burst(b.x,b.y,4,'#ffd93d',40,0.25); break; }   // Khiên Thánh: đạn → +5 EN
        if(!player.dead && dist(b.x,b.y,player.x,player.y-7*giantScale(player))<b.r+3*giantScale(player)){ if(player.iframe<=0&&player.shield<=0&&player.dash<=0&&!godMode){ hurtPlayer(1); b.a=false; break; } else if(player.shield>0){ b.a=false; burst(b.x,b.y,3,'#58e2f2',30,0.2); break; } }
        if(pet.rest<=0 && dist(b.x,b.y,pet.x,pet.y-5)<b.r+4){ pet.dmgTaken+=b.dmg*3; b.a=false; burst(b.x,b.y,3,'#e4eaf8',30,0.2); if(pet.dmgTaken>=CONFIG.PET_HP_LIMIT){ pet.rest=CONFIG.PET_REST; } break; }
      }
    }
  }
}

function updateItems(dt){
  for(let i=items.length-1;i>=0;i--){ const it=items[i]; it.t=(it.t||0)+dt;
    if(it.vx!==undefined){ it.x+=it.vx*dt; it.y+=it.vy*dt; it.vx*=0.9; it.vy*=0.9; const tmp={x:it.x,y:it.y,hw:2,hh:2}; if(unstick(tmp,R.map,R.W,R.H)){ it.x=tmp.x; it.y=tmp.y; }
      if(Math.abs(it.vx)+Math.abs(it.vy)<0.5){ it.vx=undefined; it.vy=undefined; } }   // [AUDIT P3] đồ đã nằm yên → thôi unstick + cấp phát mỗi khung
    if(it.shake>0) it.shake-=dt;
    if(player.dead) continue;
    const d=dist(it.x,it.y,player.x,player.y-4);
    if(it.kind==='blood'){ if(it.t>0.3&&d<CONFIG.MAGNET_RADIUS){ const s=70+(CONFIG.MAGNET_RADIUS-d)*6; it.vx=(player.x-it.x)/d*s; it.vy=(player.y-4-it.y)/d*s; }
      if(d<6){ items.splice(i,1); sfx('pickup'); if(player.hp<player.maxHp){ player.hp++; floatText(player.x,player.y-20,'+1 HP','#ee4455'); } else { player.armor=Math.min(player.maxArmor,player.armor+1); } } continue; }
    if(it.kind==='coin'||it.kind==='orb'){
      if(it.t>0.3 && d<CONFIG.MAGNET_RADIUS){ const s=60+(CONFIG.MAGNET_RADIUS-d)*6; it.vx=(player.x-it.x)/d*s; it.vy=(player.y-4-it.y)/d*s; }
      if(d<6){ items.splice(i,1); if(it.kind==='coin'){ run.gold++; sfx('coin'); part(it.x,it.y,0,-20,0.3,'#ffd93d',1); } else { player.en=Math.min(player.maxEn,player.en+10); sfx('pickup'); } }
    } else if(it.kind==='hp'||it.kind==='en'){
      if(it.t>0.3 && d<8){ items.splice(i,1); sfx('pickup'); if(it.kind==='hp'){ player.hp=Math.min(player.maxHp,player.hp+2); floatText(player.x,player.y-20,'+2 HP','#ee4455'); } else { player.en=Math.min(player.maxEn,player.en+60); floatText(player.x,player.y-20,'+60 EN','#3f8dff'); } }
    } else if(it.kind==='portal'){ it.t+=0; }
  }
}
// Bẫy gai: tắt 1.5s → cảnh báo 0.4s → bật 0.8s
function spikePhase(){ const t=gtime%2.7; return t<1.5?0:t<1.9?1:2; }
function updateSpikes(){ if(spikePhase()!==2||player.dead||CL().hazardImmune) return; const tx=Math.floor(player.x/TS), ty=Math.floor(player.y/TS); for(const [x,y] of R.spikes) if(x===tx&&y===ty) hurtPlayer(2); }
// Thú cưng: theo người chơi, cào quái, đỡ đạn, nghỉ khi mệt
function updatePet(dt){
  const p=pet; p.anim+=dt; p.atk-=dt;
  if(p.rest>0){ p.rest-=dt; if(p.rest<=0){ p.dmgTaken=0; floatText(p.x,p.y-14,'!','#ffd93d'); } return; }
  let tx=player.x-player.facing*22, ty=player.y+3, spd=statOf(player,'spd')*1.1;   // [PLAN SK-08]   // giữ khoảng 18–30px phía sau, không đè lên người chơi
  let tgt=null, bd=80; for(const e of enemies){ if(e.hp<=0||e.spawnT>0||e.boss&&e.alpha<1) continue; const d=dist(player.x,player.y,e.x,e.y); if(d<bd){ bd=d; tgt=e; } }
  if(tgt){ tx=tgt.x; ty=tgt.y; spd=95; if(dist(p.x,p.y,tgt.x,tgt.y)<tgt.r+8 && p.atk<=0){ p.atk=CONFIG.PET_ATK_CD; damageEnemy(tgt,CONFIG.PET_DAMAGE,false); fx.push({kind:'claw',x:tgt.x,y:tgt.y-tgt.bo,t:0.15}); } }
  const d=dist(p.x,p.y,tx,ty);
  if(d>(tgt?6:5)){ const s=Math.min(spd*dt,d); moveEntity(p,(tx-p.x)/d*s,(ty-p.y)/d*s,R.map,R.W,R.H); p.moving=true; if(Math.abs(tx-p.x)>1) p.facing=tx<p.x?-1:1; } else p.moving=false;
  if(dist(p.x,p.y,player.x,player.y)>140){ p.x=player.x; p.y=player.y; }
  unstick(p,R.map,R.W,R.H);
}
// Hiệu ứng tạm + dấu X sinh quái
function updateFx(dt){
  for(let i=timers.length-1;i>=0;i--){ const T=timers[i];
    if(T.room!==room||T.run!==run){ timers.splice(i,1); if(T.carry&&T.run===run&&player) T.f({x:player.x,y:player.y,carried:true}); continue; }   // [PLAN FX-26] khác phòng: carry → chạy ngay tại người chơi, còn lại huỷ
    T.t-=dt; if(T.t<=0){ timers.splice(i,1); T.f(); } }
  for(const f of fx){ f.t-=dt;
    if(f.kind==='spawn' && f.t<=0){ if(state==='play'&&room.state==='fight'){ const e=spawnEnemy(f.type,f.x,f.y,f.champion); unstick(e,R.map,R.W,R.H); } }
    if(f.kind==='meteor' && f.t<=0){ burst(f.x,f.y,16,'#ff9b30',80,0.4,2); shake=Math.max(shake,2); sfx('boom'); if(dist(f.x,f.y,player.x,player.y-4)<20+4*(giantScale(player)-1)) hurtPlayer(2,'fire'); }
    if(f.kind==='pmeteor'){ if(f.delay>0) f.delay-=dt; else { f.z-=380*dt; if(f.z<=0){ f.t=0; shake=Math.max(shake,3); sfx('boom'); burst(f.x,f.y,22,'#ff9b30',100,0.5,2);
        fx.push({kind:'boomRing',x:f.x,y:f.y,r:28,t:0.25,col:'#ff9b30'}); fx.push({kind:'lava',x:f.x,y:f.y,t:2.5,tick:0});
        for(const e of enemies) if(e.hp>0&&e.spawnT<=0&&dist(f.x,f.y,e.x,e.y-e.bo)<28+e.r){ damageEnemy(e,10,false,'#ff9b30'); e.burn=3; } } } }
    if(f.kind==='acid'){ f.tick-=dt; if(f.tick<=0){ f.tick=0.4; for(const e of enemies) if(e.hp>0&&e.spawnT<=0&&dist(f.x,f.y,e.x,e.y)<f.r){ e.poison=Math.max(e.poison||0,2); damageEnemy(e,1,false,'#92ea5e'); } }
      if(Math.random()<0.35) part(f.x+rr(-f.r,f.r),f.y+rr(-f.r/2,f.r/2),0,-14,0.5,pick(['#92ea5e','#a6e24e']),1); }
    if(f.kind==='bacid'){ f.age+=dt; if(f.age>0.8){ f.tick-=dt; if(f.tick<=0){ f.tick=0.6; if(dist(f.x,f.y,player.x,player.y)<14) hurtPlayer(1,'acid'); } } }
    if(f.kind==='lava'){ f.tick-=dt; if(f.tick<=0){ f.tick=0.4; for(const e of enemies) if(e.hp>0&&e.spawnT<=0&&dist(f.x,f.y,e.x,e.y)<16) e.burn=Math.max(e.burn||0,1.5); }
      if(Math.random()<0.2) part(f.x+rr(-10,10),f.y+rr(-4,4),0,-15,0.4,'#ff9b30',1); }
    if(f.kind==='boom' && f.t<=0 && !f.done){ f.done=true; burst(f.x,f.y,18,pick(['#ff9b30','#ffd93d','#ee4455']),100,0.5,2); sfx('boom'); shake=Math.max(shake,3); }
  }
  compactInPlace(fx,f=>f.t>0||(f.kind==='boom'&&!f.done));   // [PLAN PF-01] nén tại chỗ, không tạo mảng mới mỗi khung
  for(const p of PART){ if(!p.a) continue; p.life-=dt; if(p.life<=0){p.a=false;continue;} p.vy+=p.grav*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.94; p.vy*=p.grav?1:0.94; }
  for(const t of FTXT){ if(!t.a) continue; t.t+=dt; if(t.t>0.6) t.a=false; }
}
// Một bước logic cố định 1/60s
function step(dt){
  gtime+=dt; run.time+=dt;
  if(fade>0){ const before=fade; fade-=dt; if(before>0.1&&fade<=0.1&&fadeAct){ const f=fadeAct; fadeAct=null; f(); } if(fade<0) fade=0; return; }
  if(banner>0) banner-=dt;
  updatePlayer(dt);
  if(state!=='play') return;
  updateRoomFlow(dt);
  for(const e of enemies) updateEnemy(e,dt);
  separate();
  compactInPlace(enemies,e=>e.hp>0);   // [PLAN PF-01]
  updateBullets(dt);
  updateExtras(dt);
  updateG7(dt);
  updatePet(dt);
  updateItems(dt);
  updateSpikes();
  updateFx(dt);
  if(toastT>0) toastT-=dt;
  shake*=Math.pow(0.02,dt); if(shake<0.2) shake=0;
  whiteFlash=Math.max(0,whiteFlash-dt*6);
  clampCam(false);
}

let CX=0, CY=0;
const hash2=(x,y)=>{ let h=(x*374761393+y*668265263)^0x5bd1e995; h=Math.imul(h^(h>>>13),1274126177); return (h^(h>>>16))>>>0; };
// Nướng nền phòng vào một canvas (vẽ lại khi map đổi)
function renderRoomCanvas(){
  const T=TILES[floorData.biome];
  // nền phòng dựng ở 8× (HD); chỉ giữ canvas của phòng đang đứng để tiết kiệm bộ nhớ
  if(!R.canvas){ R.canvas=newCanvas(R.W*TS*SCALE_UNIT,R.H*TS*SCALE_UNIT); R.canvas.hd=SCALE_UNIT; hdCtx(R.canvas.getContext('2d')); }
  const c=R.canvas.getContext('2d'); c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,R.canvas.width,R.canvas.height); c.setTransform(SCALE_UNIT,0,0,SCALE_UNIT,0,0); c.imageSmoothingEnabled=false;
  for(let y=0;y<R.H;y++) for(let x=0;x<R.W;x++){
    const v=R.map[y*R.W+x], h=hash2(x,y), X=x*TS, Y=y*TS;
    if(v===1){ const below = y+1<R.H ? R.map[(y+1)*R.W+x] : 1;
      c.drawImage(below!==1 ? (h%3===0?T.wall_face_b:T.wall_face) : T.wall_top, X, Y); continue; }
    const fv=(h>>>8)%3, fn=h%7===0?'floor_b':h%5===0?'floor_c':'floor_a'; c.drawImage(fv?T[fn+'_'+fv]:T[fn], X, Y);
    if(v===3) c.drawImage(T.gate,X,Y);
    if(v===4){ const pk=R.propKind&&R.propKind[y*R.W+x]; c.drawImage((pk?A['barrel_'+pk]:(h%2?A.crate:A.barrel)).img,X,Y); }
  }
  R.dirty=false;
}
// Vẽ sprite theo neo (làm tròn 1/8 đơn vị = 1 pixel HD)
function dspr(s,x,y,flip,white){
  const img = white ? (flip?s.whiteF:s.white) : (flip?s.flip:s.img);
  const ax = flip ? s.w-s.ax : s.ax;
  g.drawImage(img, Q(x-ax)-CX, Q(y-s.ay)-CY);
}
function dglow(s,x,y,flip){ const img=flip?s.glowF:s.glow; if(!img) return; const ax=flip?s.w-s.ax:s.ax, X=Q(x-ax)-CX, Y=Q(y-s.ay)-CY, d=0.75;
  g.globalAlpha=0.6+0.3*Math.sin(gtime*8); g.drawImage(img,X-d,Y); g.drawImage(img,X+d,Y); g.drawImage(img,X,Y-d); g.drawImage(img,X,Y+d); g.globalAlpha=1; }
function shadow(x,y,w){ w=Math.max(4,Math.min(28,w&~1)); const c=A.shadow[w]; g.drawImage(c,Q(x-w/2)-CX,Q(y-c.height/SCALE_UNIT/2)-CY); }
// Vẽ súng xoay quanh tay (chỗ duy nhất dùng rotate cùng đạn mũi tên)
function drawGun(spr,hand,aim,recoil,flipY){
  // [AUDIT R3] flipY (tuỳ chọn): vũ khí cận chiến lật theo HƯỚNG NHÌN, không theo cos(góc vẽ) → lưỡi không "nhảy" sang phía kia giữa nhát chém
  g.save(); g.translate(hand.x-CX,hand.y-CY); g.rotate(aim); if(flipY!==undefined?flipY:Math.cos(aim)<0) g.scale(1,-1);
  g.translate(-recoil,0); if(spr.rot0) g.rotate(-spr.rot0);          // vũ khí vẽ chéo (katana): xoay ngược góc gốc
  g.drawImage(spr.img,-spr.gx,-spr.gy); g.restore();
}
// Chấm pixel theo đường tròn
function pixCircle(x,y,r,col,step){ g.fillStyle=col; const n=Math.max(8,Math.round(r*2*Math.PI/(step||2))); for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; g.fillRect(Q(x+Math.cos(a)*r)-CX,Q(y+Math.sin(a)*r)-CY,PX,PX); } }
function pixLine(x1,y1,x2,y2,col,w){ g.fillStyle=col; w=Math.max(1,Math.round(w*0.5*SCALE_UNIT))*PX; const n=Math.max(1,Math.ceil(Math.hypot(x2-x1,y2-y1)*2)); const o=w/2; for(let i=0;i<=n;i++){ const t=i/n; g.fillRect(Q(x1+(x2-x1)*t-o)-CX,Q(y1+(y2-y1)*t-o)-CY,w,w); } }

function heroFrame(cls,anim,moving,armed){ const H=(armed&&HERO_ARMED[cls])||HERO[cls]; if(!moving) return H.idle; const k=Math.floor(anim/0.1)%4; return k===1?H.a:k===3?H.b:H.idle; }
function drawPlayer(){

// Ánh sáng: KHÔNG phủ tối – cả phòng sáng đều; chỉ đuốc (và cổng/hạt energy) cộng thêm quầng ấm nhẹ dạng bậc
function glow(x,y,r,col,a){
  x=Math.round(x)-CX; y=Math.round(y)-CY; if(x<-r||y<-r||x>VW+r||y>VH+r) return;
  g.fillStyle=col;
  for(const [k,al] of [[1,a*0.45],[0.66,a*0.75],[0.36,a]]){ g.globalAlpha=al; g.beginPath(); g.arc(x,y,Math.round(r*k),0,Math.PI*2); g.fill(); }
}
function renderLight(){

function renderWorld(){

  g.drawImage(R.canvas,-CX,-CY);

  for(const x of R.torches) dspr(Math.floor(gtime/0.12)%2?A.torch_b:A.torch_a,x*TS+8,TS+14,false);
  for(const f of fx) if(GROUND_FX.has(f.kind)) drawFx(f);
  for(const f of fx) if(f.kind==='pmeteor'&&f.delay<=0){ shadow(f.x,f.y,Math.max(4,Math.round(20-f.z/10))); }
  for(const it of items) if(['coin','orb','hp','en','blood'].includes(it.kind)) drawPickup(it);   // đồ phẳng sát đất: vẽ trước
  // y-sort  [AUDIT F1] vũ khí/lá bài dưới đất có chiều cao → đưa vào y-sort để không bị rương/quầy che khi nằm phía trước
  const list=[];
  for(const it of items) if(['chest','merchant','shop','portal','scroll','vending','skillshop','forge','shrine','fusion','weapon','card'].includes(it.kind)) list.push([it.y,0,it]);
  for(const e of enemies) list.push([e.y,1,e]);
  list.push([player.y,2,player]); list.push([pet.y-6,3,pet]);
  list.sort((a,b)=>a[0]-b[0]);
  for(const [,k,o] of list){ if(k===0){ if(o.kind==='weapon'||o.kind==='card') drawPickup(o); else drawItem(o); } else if(k===1) drawEnemy(o); else if(k===2) drawPlayer(); else drawPet(); }
  for(const b of BUL) if(b.a&&b.delay<=0) drawBullet(b);
  for(const f of fx) if(!GROUND_FX.has(f.kind)) drawFx(f);
  for(const p of PART){ if(!p.a) continue; g.globalAlpha=Math.min(1,p.life/p.max*1.5); g.fillStyle=p.col; const ps=PX*Math.max(1,Math.round(p.size)); g.fillRect(Q(p.x)-CX,Q(p.y)-CY,ps,ps); }

  g.drawImage(R.canvas,0,(R.H-1)*TS,R.W*TS,TS,-CX,(R.H-1)*TS-CY,R.W*TS,TS);

  g.globalAlpha=1;
  if(nearInteract && !player.dead){ const it=nearInteract; if(Math.floor(gtime*4)%2){ const P=interactHintPos(it); text(isTouch?'!':'E',P.x,P.y,'#ffd93d',1,'center'); }   // [PLAN UI-04] nhãn E né HUD
    if(it.kind==='weapon') weaponPanel(it); if(it.kind==='fusion') fusionPanel(it); }
  if(CONFIG.SHOW_DEBUG) drawDebug();
}

function bar(x,y,w,v,max,col,label,flash){
  const H=8, f=Math.max(0,Math.min(1,v/Math.max(1,max)));

  if(f>0){ g.save(); rrect(x,y,w,H,2.5); g.clip();
    g.fillStyle=flash?'#ee4455':col; g.fillRect(x,y,w*f,H);
    g.fillStyle='rgba(255,255,255,0.28)'; g.fillRect(x,y,w*f,2.2);
    g.fillStyle='rgba(0,0,0,0.18)'; g.fillRect(x,y+H-2,w*f,2);
    if(max<=12){ g.fillStyle='rgba(12,9,22,0.45)'; for(let i=1;i<max;i++) g.fillRect(x+w*i/max-0.25,y,0.5,H); }

const cardOk=c=>(!c.once||!run.cards[c.once])&&(!c.cond||c.cond());
// Rút 3 lá: 1 hiệu ứng + 1 chỉ số + 1 kỹ năng (nếu còn), không trùng
// mode: 'boss' = hiệu ứng + chỉ số + kỹ năng · 'buff' (máy bán hàng) = hiệu ứng + hiệu ứng + chỉ số · 'shrine' = kỹ năng + kỹ năng + hiệu ứng
function openCards(mode){
  const pick1=cat=>{ const pool=CARDS.filter(c=>c.cat===cat&&cardOk(c)&&!cardChoices.includes(c)); return pool.length?pool[Math.floor(Math.random()*pool.length)]:null; };
  cardChoices=[];
  const plan=mode==='buff'?['effect','effect','stat']:mode==='shrine'?['skill','skill','effect']:['effect','stat','skill'];
  for(const cat of plan){ const c=pick1(cat)||pick1('effect')||pick1('stat'); if(c) cardChoices.push(c); }
  menuSel=0; state='cards';
}
// Hàng biểu tượng các lá bài đã nhận (dưới bảng chỉ số)
function drawCardRow(){
  const L=(run&&run.cardList)||[]; if(!L.length) return;
  const ns=statusLines(player).length, y=46+(ns?6+(ns-1)*STATUS_LINE_H:0);   // [PLAN FX-33] dời theo số dòng trạng thái (1 dòng: +6 như cũ)
  g.fillStyle='rgba(12,9,22,0.55)'; rrect(2,y-1.5,Math.min(L.length,12)*9.5+3,11,3); g.fill();
  L.slice(-12).forEach((n,i)=>{ const ic=A[CARD_ICON[n]]; if(ic) g.drawImage(ic.img,4+i*9.5,y,ic.w,ic.h); });
}
function cardDesc(c){ return typeof c.desc==='function'?c.desc():c.desc; }
// Vẽ 1 lá bài: khung màu theo nhóm, biểu tượng pixel, tên 2 dòng, mô tả
function drawCard(b,sel,i){
  const st=CARD_STYLE[b.card.cat];
  g.fillStyle=sel?'#ffffff':st.col; rrect(b.x-1.5,b.y-1.5,b.w+3,b.h+3,5); g.fill();
  g.fillStyle='#1a1425'; rrect(b.x,b.y,b.w,b.h,4); g.fill();
  g.fillStyle=st.col; g.globalAlpha=0.22; rrect(b.x+3,b.y+3,b.w-6,22,3); g.fill(); g.globalAlpha=1;
  // biểu tượng pixel riêng của lá (phóng nguyên 2× cho sắc nét)
  const cx=b.x+b.w/2, cy=b.y+14, ic=A[CARD_ICON[b.card.name]];
  if(ic){ g.fillStyle='rgba(12,9,22,0.6)'; rrect(cx-10,cy-10,20,20,4); g.fill(); g.drawImage(ic.img,Q(cx-ic.w),Q(cy-ic.h),ic.w*2,ic.h*2); }
  text(st.label,cx,b.y+28,st.col,1,'center');
  const words=b.card.name.split(' '); const l1=words.slice(0,Math.ceil(words.length/2)).join(' '), l2=words.slice(Math.ceil(words.length/2)).join(' ');
  text(l1,cx,b.y+38,sel?'#ffd93d':'#ffffff',1,'center'); if(l2) text(l2,cx,b.y+46,sel?'#ffd93d':'#ffffff',1,'center');
  const d=cardDesc(b.card).split(' '); let line='', ly=b.y+58;
  for(const w of d){ if((line+' '+w).trim().length>14){ text(line,cx,ly,'#8290b5',1,'center'); ly+=7; line=w; } else line=(line+' '+w).trim(); }
  if(line) text(line,cx,ly,'#8290b5',1,'center');
  text(String(i+1),b.x+4,b.y+3,'#4c577f');
}

// ----- 3. KỸ NĂNG: CHÍNH + THAY THẾ + THỨC TỈNH -----
const SKILL_COL={knight:'#ffd93d',rogue:'#b066f0',paladin:'#ffd93d',wizard:'#58e2f2',pyromancer:'#ff9b30',vampire_noctis:'#ee4455',ninja_kage:'#ee4455',frost_valkyrie:'#bfeaf5',plague_chemist:'#92ea5e',cyber_scientist:'#58e2f2',hazmat_commando:'#ff74ba'};
const ALT_SKILLS={knight:{name:'BLADE STORM'},rogue:{name:'SMOKE BOMB'},paladin:{name:'HAMMER QUAKE'},wizard:{name:'THUNDER RAIN'},pyromancer:{name:'PHOENIX TRAIL'},
  vampire_noctis:{name:'BLOOD VORTEX'},ninja_kage:{name:'SHURIKEN STORM'},frost_valkyrie:{name:'BLIZZARD NOVA'},plague_chemist:{name:'PLAGUE BURST'},cyber_scientist:{name:'TESLA TURRET'},hazmat_commando:{name:'ORBITAL STRIKE'}};
function skillName(){ const p=player; return (p.alt?ALT_SKILLS[p.cls].name:CLASSES[p.cls].skill)+(run.awaken?'+':''); }
function activateAura(t){ player.skillActiveT=Math.max(player.skillActiveT||0,t); }
function aliveEnemies(){ return enemies.filter(e=>e.hp>0&&e.spawnT<=0); }
function nearest(list,x,y,maxD,skip){ let best=null,bd=maxD||1e9; for(const e of list){ if(skip&&skip.has(e)) continue; const d=dist(x,y,e.x,e.y-e.bo); if(d<bd){bd=d;best=e;} } return best; }
function useSkill(){
  const p=player, aw=run.awaken?1:0, col=SKILL_COL[p.cls];
  const legacy=!p.alt&&['ninja_kage','plague_chemist','cyber_scientist','hazmat_commando'].includes(p.cls);   // [PLAN FX-31] bỏ 'rogue'
  if(!legacy) floatText(p.x,p.y-24,skillName(),col);
  skillImpact(col,p.cls==='paladin'&&!p.alt?2:1.2);
  if(p.alt){ p.skillCD=p.skillMax; sfx('skill'); altSkill(p.cls,aw); return; }
  switch(p.cls){
    case 'knight':   // Song Tuyệt Kỹ: 2 vũ khí 5s, hào quang lửa vàng, mỗi mạng hạ +0.8s
      p.skillCD=p.skillMax; sfx('skill'); p.dual=7+aw*2; activateAura(p.dual); stomp(p.x,p.y,55,6+aw*3,'#ffd93d'); break;
    case 'paladin':  // Khiên Thánh: hấp thụ mọi sát thương, đạn chạm khiên → +5 EN, hết hạn nổ xung kích
      p.skillCD=p.skillMax; sfx('boom'); startTitan(aw); break;
    // [PLAN FX-31] đã xoá case 'wizard' gốc (Lồng Sét): Wizard chính chạy NEW_SKILL.wizard (skThunderWeb) qua lớp bọc useSkill,
    // nhánh ALT return trước switch → case này không bao giờ chạy (C6 của audit chỉ sửa comment).
    case 'pyromancer': { // Vòng Hỏa Ngục + 5 thiên thạch rơi chéo
      p.skillCD=p.skillMax; sfx('boom'); shake=Math.max(shake,4); p.spinT=0.45;
      fx.push({kind:'firering',x:p.x,y:p.y-6,t:0.6,max:90+aw*20});
      const ts=aliveEnemies().sort((a,b)=>dist(p.x,p.y,a.x,a.y)-dist(p.x,p.y,b.x,b.y)), n=7+aw*2;
      for(let m=0;m<n;m++){ const t=ts[m%Math.max(1,ts.length)]; const tx=t?t.x+rr(-6,6):p.x+rr(-70,70), ty=t?t.y+rr(-4,4):p.y+rr(-45,45);
        fx.push({kind:'pmeteor',x:tx,y:ty,z:140,delay:0.15+m*0.12,t:9,diag:true}); }
      activateAura(1.2); break; }
    case 'vampire_noctis': // Huyết Tửu Bão Dơi: lắc ly 0.45s rồi thả đàn dơi đen
      p.skillCD=p.skillMax; sfx('skill'); p.chaliceT=0.45; activateAura(3.5);
      p.iframe=Math.max(p.iframe,0.6); setTimeout0(0.45,()=>spawnBats(Math.min(28,16+aw*6+(run.cards.pellets||0)),aw)); break; // Shotgun Boost: +2 dơi
    case 'frost_valkyrie': glacialSpikes(aw); break;
    default:
      legacySkill();
      if(aw){ if(p.cls==='hazmat_commando') p.shield+=1.5; if(p.cls==='cyber_scientist') for(const e of aliveEnemies()) e.stun+=1;
        if(p.cls==='plague_chemist'){ const f=fx[fx.length-1]; if(f&&f.kind==='acid'){ f.r=45; f.t=6; } }
        if(p.cls==='ninja_kage') setTimeout0(0.35,()=>katanaCombo(WEAPONS.blood_katana.dmg)); }   // [PLAN FX-31] bỏ dòng 'rogue' dashMul
      activateAura(p.cls==='hazmat_commando'?p.shield:p.cls==='plague_chemist'?4:0.6);
  }
}
// Cột Băng Vĩnh Cửu: quạt 5 tia, mỗi tia 6 cột băng mọc lần lượt
// Hiệu ứng tung chiêu: chớp màu toàn màn hình, 2 vòng xung kích, bụi hạt toả ra, rung màn hình
let skillFlashT=0, skillFlashCol='#ffffff';
function skillImpact(col,power){
  const p=player; skillFlashT=0.25; skillFlashCol=col; shake=Math.max(shake,2+power*2);
  fx.push({kind:'boomRing',x:p.x,y:p.y-6,r:30+power*22,t:0.45,col});
  fx.push({kind:'boomRing',x:p.x,y:p.y-6,r:14+power*10,t:0.25,col:'#ffffff'});
  burst(p.x,p.y-8,16+power*8,col,80+power*30,0.6,2);
  for(let i=0;i<12;i++){ const a=i/12*Math.PI*2; part(p.x+Math.cos(a)*6,p.y-2,Math.cos(a)*80,Math.sin(a)*40-35,0.55,i%2?col:'#ffffff',2,140); }
}
// Dậm đất: đẩy lùi + sát thương quanh người
function stomp(x,y,r,dmg,col){
  fx.push({kind:'boomRing',x,y:y-2,r,t:0.35,col}); sfx('boom');
  for(const e of aliveEnemies()){ const d=dist(x,y,e.x,e.y); if(d<r+e.r){ const k=(r-d)/r*22+6; moveEntity(e,(e.x-x)/(d||1)*k,(e.y-y)/(d||1)*k,R.map,R.W,R.H); damageEnemy(e,dmg,false,col); e.stun=Math.max(e.stun||0,0.5); } }
}
// Paladin TITAN AEGIS: hoá khổng lồ, +5 HP, +5 giáp, nhận 50% sát thương
function startTitan(aw){
  const p=player, T=8+aw*2;
  if(!(p.titan>0)){ p.maxHp+=5; p.maxArmor+=5; }
  p.hp=Math.min(p.maxHp,p.hp+5); p.armor=Math.min(p.maxArmor,p.armor+5);
  p.titan=T; p.titanMax=T; p.dmgBank=0; activateAura(T);
  stomp(p.x,p.y,65,8+aw*4,'#ffd93d'); floatText(p.x,p.y-34,'+5 HP +5 ARMOR','#ffd93d');
}
function feetScale(m){ const p=player, s=giantScale(p); return s===1?m:{x:p.x+(m.x-p.x)*s, y:p.y+(m.y-p.y)*s}; }
function giantScale(p){ if(!(p.titan>0)) return 1; const up=Math.min(1,(p.titanMax-p.titan)/0.3), dn=Math.min(1,p.titan/0.3); return 1+0.6*Math.min(up,dn); }
function glacialSpikes(aw){
  const p=player; p.skillCD=p.skillMax; sfx('skill'); shake=Math.max(shake,2);
  stomp(p.x,p.y,50,5+aw*3,'#bfeaf5'); for(const e of aliveEnemies()) if(dist(p.x,p.y,e.x,e.y)<50) e.stun=Math.max(e.stun||0,1.5);
  const rays=7+aw*2, spread=0.8;
  for(let r=0;r<rays;r++){ const a=p.aim+(r/(rays-1)-0.5)*2*spread;
    for(let k=0;k<6;k++) fx.push({kind:'icespike',x:p.x+Math.cos(a)*(14+k*12),y:p.y+Math.sin(a)*(14+k*12),delay:k*0.06,t:1.3,hit:false,aw}); }
  activateAura(1);
}
// Kỹ năng thay thế
function altSkill(cls,aw){
  const p=player;
  switch(cls){
    case 'knight': p.storm=1.6+aw*0.8; p.stormTick=0; activateAura(p.storm); break;
    // [PLAN FX-31] đã xoá nhánh rogue (Smoke Bomb của lớp Shade – không có trong CLASSES)
    case 'paladin': for(let i=0;i<3;i++) setTimeout0(i*0.25,()=>quake(p.x,p.y,30+i*20,8+aw*4)); activateAura(0.8); break;
    case 'wizard': p.rain=3+aw*1.5; p.rainTick=0; p.raiseT=0.45; activateAura(p.rain); break;
    case 'pyromancer': p.phoenix=4+aw*2; p.phoenixTick=0; p.spinT=0.45; activateAura(p.phoenix); break;
    case 'vampire_noctis': { const t=nearest(aliveEnemies(),p.x,p.y,160); const x=t?t.x:p.x+Math.cos(p.aim)*50, y=t?t.y:p.y+Math.sin(p.aim)*50;
      p.chaliceT=0.45; fx.push({kind:'vortex',x,y,t:3+aw,tick:0,hits:0}); activateAura(3+aw); break; }
    case 'ninja_kage': for(let i=0;i<16+aw*8;i++){ const a=i/(16+aw*8)*Math.PI*2; playerBullet(p.x,p.y-6,a,190,{spr:'shuriken',r:2.5,dmg:4,bounce:3,spin:true,life:1.5,max:1.5}); } activateAura(0.5); break;
    case 'frost_valkyrie': { const cls0=p.cls; legacySkill(); p.cls=cls0; activateAura(0.6); break; }
    case 'plague_chemist': for(const e of aliveEnemies()){ e.poison=Math.max(e.poison||0,5+aw*3); damageEnemy(e,4,false,'#92ea5e'); burst(e.x,e.y-e.bo,8,'#92ea5e',50,0.4); } activateAura(1); break;
    case 'cyber_scientist': fx.push({kind:'tturret',x:p.x+p.facing*12,y:p.y,t:6+aw*3,cd:0}); activateAura(1); break;
    case 'hazmat_commando': { const ts=aliveEnemies(), n=6+aw*3;
      for(let i=0;i<n;i++){ const t=ts[i%Math.max(1,ts.length)]; fx.push({kind:'orbital',x:t?t.x+rr(-8,8):p.x+rr(-80,80),y:t?t.y+rr(-6,6):p.y+rr(-50,50),fuse:0.6+i*0.2,t:5}); }
      activateAura(0.6+n*0.2); break; }
  }
}
function quake(x,y,r,dmg){
  fx.push({kind:'boomRing',x,y:y-4,r,t:0.3,col:'#ffd93d'}); shake=Math.max(shake,3); sfx('boom');
  for(const e of aliveEnemies()) if(dist(x,y,e.x,e.y)<r+e.r){ damageEnemy(e,dmg,false,'#ffd93d'); e.stun=Math.max(e.stun||0,1); }
}
// Đàn dơi đen mắt đỏ bay ra từ miệng ly
function spawnBats(n,aw){
  const p=player, cast={hp:2,en:4}, mz=uprightMuzzle(handPos(1),A.w_wine_chalice);
  for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; fx.push({kind:'mbat',x:mz.x,y:mz.y,vx:Math.cos(a)*140,vy:Math.sin(a)*140,state:'seek',t:5,anim:Math.random(),bit:false,cast,aw,wob:Math.random()*6}); }
  burst(mz.x,mz.y,14,'#ee4455',60,0.4,2);
}
// Cầu Từ Trường, vòng lửa, vòng xoáy máu, tháp tesla, dơi… cập nhật mỗi bước
function updateExtras(dt){
  const p=player; if(!p||p.dead) return;
  // hồi chiêu xong → lóe sáng + tia chớp trên đầu 0.4s + âm báo
  if((p.prevCD||0)>0 && p.skillCD<=0){ p.readyT=0.4; sfx('ready'); }
  p.prevCD=p.skillCD; p.readyT=Math.max(0,(p.readyT||0)-dt); p.skillActiveT=Math.max(0,(p.skillActiveT||0)-dt);
  p.spinT=Math.max(0,(p.spinT||0)-dt); p.raiseT=Math.max(0,(p.raiseT||0)-dt);

      const x=t?t.x:p.x+rr(-90,90), y=t?t.y:p.y+rr(-60,60); fx.push({kind:'bolt',pts:[[x+rr(-6,6),y-70],[x+rr(-4,4),y-35],[x,y-4]],t:0.2}); sfx('zap');
